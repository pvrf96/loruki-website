<title>Radar CVV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: app de tela cheia — barra superior, lista ranqueada à esquerda, radar ao centro, ficha deslizante à direita.
   Tema único escuro (instrumento de radar), cores definidas explicitamente. */
:root{
  --space:#05070d; --panel:#0b0f1a; --panel2:#111727; --line:#1f2840; --ink:#e7ecf7; --muted:#8892ab;
  --sweep:#5ad7ff; --act:#ffb547;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--space);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em}
.brand i{width:14px;height:14px;border-radius:50%;border:2px solid var(--sweep);box-shadow:0 0 10px var(--sweep);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--sweep)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
nav button{font:500 12.5px var(--f-ui);color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--panel2)}
nav button:disabled{cursor:not-allowed;opacity:.55}
.search{flex:1 1 220px;min-width:0;display:flex}
.search input{width:100%;background:var(--space);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:400 13px var(--f-ui);padding:8px 12px}
.search input:focus{outline:2px solid var(--sweep);outline-offset:1px}
.count{font:500 11.5px var(--f-mono);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.count b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--act);box-shadow:0 0 8px var(--act)}
.tag{font:700 9.5px var(--f-mono);letter-spacing:.08em;color:var(--space);background:var(--act);border-radius:3px;padding:2px 5px}
main{position:relative;display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lhead h2{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.lhead h2 span{font:500 11px var(--f-mono);color:var(--muted)}
.prof{display:flex;flex-wrap:wrap;gap:6px}
.pchip,.fchip{font:500 11px var(--f-mono);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 9px;cursor:pointer}
.pchip[aria-pressed="true"],.fchip[aria-pressed="true"]{color:var(--ink);border-color:var(--sweep);background:rgb(90 215 255 / .10)}
.sheetbtn{display:none}
.cards{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;text-align:left;color:var(--ink);font:inherit}
.card:hover,.card:focus-visible{border-color:var(--sweep);outline:none}
.card .rk{font:700 12px var(--f-mono);color:var(--muted);grid-row:span 2;align-self:center}
.card .nm{font-weight:600;font-size:13px;min-width:0}
.card .sc{font:700 15px var(--f-mono);color:var(--act);grid-row:span 2;align-self:center}
.card .meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.mode{position:absolute;top:12px;left:12px;display:flex;background:rgb(11 15 26 / .85);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{font:600 12px var(--f-ui);color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--sweep);color:var(--space)}
.legend{position:absolute;top:12px;right:12px;background:rgb(11 15 26 / .85);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend .st{margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.filters{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.filters .fchip{background:rgb(11 15 26 / .85);white-space:nowrap}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(12px,-50%)}
.tip small{display:block;color:var(--muted);font-size:11px}
.glabel{position:absolute;pointer-events:none;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;transform:translate(-50%,-50%);text-shadow:0 0 12px currentColor;opacity:0;transition:opacity .4s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 24px;overflow-y:auto;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;z-index:5}
.drawer.open{transform:none}
.drawer .x{align-self:flex-end;font:600 12px var(--f-ui);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.drawer h3{margin:0;font-size:18px;line-height:1.25;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0}
.fit{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.fit b{font:700 22px var(--f-mono);color:var(--act)}
.fit ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--act);padding-left:10px;margin:0}
.nowebgl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  header{gap:10px}
  nav{order:3;width:100%}
  .count{order:2}
  main{grid-template-columns:1fr}
  .list{position:absolute;left:0;right:0;bottom:0;z-index:4;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    height:58px;transition:height .3s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .list.up{height:62%}
  .sheetbtn{display:block;font:600 12px var(--f-ui);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
  .lhead{border-bottom:0}
  .list:not(.up) .prof,.list:not(.up) .cards{display:none}
  .filters{bottom:70px}
  .legend{display:none}
  .drawer{width:100%;border-left:0}
}
@media (prefers-reduced-motion: reduce){.drawer,.list{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand"><i aria-hidden="true"></i>Radar CVV</div>
    <nav aria-label="Seções">
      <button type="button" aria-current="page">Radar</button>
      <button type="button" disabled title="Em breve">Oportunidades</button>
      <button type="button" disabled title="Em breve">Países</button>
      <button type="button" disabled title="Em breve">Comparar</button>
      <button type="button" disabled title="Em breve">Tendências</button>
    </nav>
    <div class="search"><input id="q" type="search" placeholder="Buscar cidade, país ou área" aria-label="Buscar cidade, país ou área" autocomplete="off"></div>
    <div class="count"><span class="dot" aria-hidden="true"></span><span><b id="nProg">0</b> programas · <b id="nPais">0</b> países</span><span class="tag">EXEMPLO</span></div>
  </header>
  <main>
    <section class="list" id="list" aria-label="Oportunidades">
      <div class="lhead">
        <h2>Oportunidades <span id="nList"></span><button class="sheetbtn" id="sheet" type="button" aria-expanded="false">Ver lista</button></h2>
        <div class="prof" aria-label="Seu perfil">
          <button class="pchip" type="button" data-lang="inglês" aria-pressed="true">Inglês</button>
          <button class="pchip" type="button" data-lang="espanhol" aria-pressed="false">Espanhol</button>
          <button class="pchip" type="button" data-lang="alemão" aria-pressed="false">Alemão</button>
          <button class="pchip" type="button" data-lang="francês" aria-pressed="false">Francês</button>
          <button class="pchip" type="button" id="needPay" aria-pressed="true">Preciso de bolsa</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
    <section class="stage" id="stage" aria-label="Radar mundial">
      <div class="mode" role="group" aria-label="Modo do radar">
        <button type="button" id="mWorld" aria-pressed="true">Mundo</button>
        <button type="button" id="mGal" aria-pressed="false">Galáxia</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="filters" id="filters"></div>
      <div class="tip" id="tip" hidden></div>
      <aside class="drawer" id="drawer" aria-label="Ficha do programa"></aside>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const LAND=__LAND__;
const AREAS={
 aorta:{n:'Aorta',c:'#ff5a5f'},
 transp:{n:'Transplante e ECMO',c:'#b07cff'},
 cong:{n:'Congênitas',c:'#4fd1ff'},
 valv:{n:'Valvar e mitral',c:'#ffd166'},
 estr:{n:'Estrutural e TAVI',c:'#6ee7a8'},
 coron:{n:'Coronária',c:'#ff8fcf'}
};
// cidade, país, idioma, lat, lon — dados de EXEMPLO (cidades reais, programas fictícios)
const CITIES=[
['Toronto','Canadá','inglês',43.65,-79.38],['Montreal','Canadá','francês',45.5,-73.57],['Vancouver','Canadá','inglês',49.28,-123.12],
['Nova York','EUA','inglês',40.71,-74.0],['Boston','EUA','inglês',42.36,-71.06],['Houston','EUA','inglês',29.76,-95.37],['Cleveland','EUA','inglês',41.5,-81.69],
['Rochester (MN)','EUA','inglês',44.02,-92.47],['Los Angeles','EUA','inglês',34.05,-118.24],['Palo Alto','EUA','inglês',37.44,-122.14],['Atlanta','EUA','inglês',33.75,-84.39],['Seattle','EUA','inglês',47.61,-122.33],
['Cidade do México','México','espanhol',19.43,-99.13],['Bogotá','Colômbia','espanhol',4.71,-74.07],['Lima','Peru','espanhol',-12.05,-77.04],['Santiago','Chile','espanhol',-33.45,-70.67],['Buenos Aires','Argentina','espanhol',-34.6,-58.38],
['São Paulo','Brasil','português',-23.55,-46.63],['Rio de Janeiro','Brasil','português',-22.91,-43.17],['Belo Horizonte','Brasil','português',-19.92,-43.94],['Porto Alegre','Brasil','português',-30.03,-51.23],['Curitiba','Brasil','português',-25.43,-49.27],['Recife','Brasil','português',-8.05,-34.88],['Brasília','Brasil','português',-15.79,-47.88],
['Londres','Reino Unido','inglês',51.51,-0.13],['Birmingham','Reino Unido','inglês',52.49,-1.89],['Paris','França','francês',48.86,2.35],['Lyon','França','francês',45.76,4.84],['Berlim','Alemanha','alemão',52.52,13.4],['Munique','Alemanha','alemão',48.14,11.58],
['Leipzig','Alemanha','alemão',51.34,12.37],['Hamburgo','Alemanha','alemão',53.55,9.99],['Zurique','Suíça','alemão',47.38,8.54],['Viena','Áustria','alemão',48.21,16.37],['Milão','Itália','italiano',45.46,9.19],['Roma','Itália','italiano',41.9,12.5],
['Madri','Espanha','espanhol',40.42,-3.7],['Barcelona','Espanha','espanhol',41.39,2.17],['Lisboa','Portugal','português',38.72,-9.14],['Porto','Portugal','português',41.15,-8.61],['Amsterdã','Países Baixos','neerlandês',52.37,4.9],['Lovaina','Bélgica','neerlandês',50.88,4.7],
['Estocolmo','Suécia','sueco',59.33,18.07],['Copenhague','Dinamarca','dinamarquês',55.68,12.57],['Oslo','Noruega','norueguês',59.91,10.75],['Varsóvia','Polônia','polonês',52.23,21.01],['Praga','Tchéquia','tcheco',50.08,14.44],['Istambul','Turquia','turco',41.01,28.98],
['Tel Aviv','Israel','hebraico',32.09,34.78],['Riad','Arábia Saudita','inglês',24.71,46.68],['Dubai','Emirados Árabes','inglês',25.2,55.27],['Cairo','Egito','árabe',30.04,31.24],['Cidade do Cabo','África do Sul','inglês',-33.92,18.42],['Joanesburgo','África do Sul','inglês',-26.2,28.05],
['Nairóbi','Quênia','inglês',-1.29,36.82],['Mumbai','Índia','inglês',19.08,72.88],['Chennai','Índia','inglês',13.08,80.27],['Nova Délhi','Índia','inglês',28.61,77.21],['Bangalore','Índia','inglês',12.97,77.59],['Singapura','Singapura','inglês',1.35,103.82],
['Bangkok','Tailândia','tailandês',13.76,100.5],['Tóquio','Japão','japonês',35.68,139.69],['Osaka','Japão','japonês',34.69,135.5],['Seul','Coreia do Sul','coreano',37.57,126.98],['Pequim','China','chinês',39.9,116.4],['Xangai','China','chinês',31.23,121.47],
['Hong Kong','China','inglês',22.32,114.17],['Sydney','Austrália','inglês',-33.87,151.21],['Melbourne','Austrália','inglês',-37.81,144.96],['Auckland','Nova Zelândia','inglês',-36.85,174.76]
];
// gerador determinístico (sempre os mesmos exemplos)
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const AK=Object.keys(AREAS);
const PROGS=[];
CITIES.forEach((c,i)=>{const n=rnd()<.35?2:1;for(let k=0;k<n;k++){
 const area=AK[Math.floor(rnd()*AK.length)];
 const dur=[6,12,12,24][Math.floor(rnd()*4)];
 const pay=rnd()<.55?'sim':rnd()<.5?'não':'sem informação';
 const st=rnd()<.35?'aberta':rnd()<.6?'fechada':'sem informação';
 PROGS.push({id:PROGS.length,name:'Programa exemplo '+String(PROGS.length+1).padStart(2,'0'),city:c[0],country:c[1],lang:c[2],
  lat:c[3]+(k?(rnd()-.5)*1.2:0),lon:c[4]+(k?(rnd()-.5)*1.2:0),area,dur,pay,st})}});

const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={mix:0,mixT:0,langs:new Set(['inglês','português']),needPay:true,areas:new Set(),open:false,paid:false,q:'',boost:0,sel:null};

// ---------- Encaixe (função pura, explicada) ----------
function fit(p){const why=[];let s=0;
 const speaks=state.langs.has(p.lang)||(p.lang==='inglês'&&state.langs.has('inglês'));
 if(speaks){s+=4;why.push('+4 você fala '+p.lang)}else why.push('+0 exige '+p.lang);
 if(state.needPay){const v=p.pay==='sim'?3:p.pay==='sem informação'?1:0;s+=v;why.push('+'+v+' bolsa: '+p.pay)}else{s+=3;why.push('+3 bolsa não é requisito seu')}
 const v2=p.st==='aberta'?2:p.st==='sem informação'?1:0;s+=v2;why.push('+'+v2+' inscrições: '+p.st);
 if(p.dur<=12){s+=1;why.push('+1 duração de até 12 meses')}else why.push('+0 duração de '+p.dur+' meses');
 return {s,why}}

// ---------- filtros ----------
function matches(p){
 if(state.areas.size&&!state.areas.has(p.area))return false;
 if(state.open&&p.st!=='aberta')return false;
 if(state.paid&&p.pay!=='sim')return false;
 if(state.q){const t=(p.city+' '+p.country+' '+AREAS[p.area].n+' '+p.name).toLowerCase();if(!t.includes(state.q))return false}
 return true}

// ---------- UI estática ----------
$('legend').innerHTML=AK.map(k=>'<span><i class="sw" style="background:'+AREAS[k].c+';box-shadow:0 0 6px '+AREAS[k].c+'"></i>'+AREAS[k].n+'</span>').join('')+
 '<span class="st">◉ pulsando: inscrições abertas</span><span>· tamanho: duração</span>';
$('filters').innerHTML=AK.map(k=>'<button type="button" class="fchip" data-area="'+k+'" aria-pressed="false">'+AREAS[k].n+'</button>').join('')+
 '<button type="button" class="fchip" id="fOpen" aria-pressed="false">Inscrições abertas</button><button type="button" class="fchip" id="fPaid" aria-pressed="false">Com bolsa</button>';
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{const a=b.dataset.area;state.areas.has(a)?state.areas.delete(a):state.areas.add(a);b.setAttribute('aria-pressed',state.areas.has(a));refresh(true)});
$('fOpen').onclick=()=>{state.open=!state.open;$('fOpen').setAttribute('aria-pressed',state.open);refresh(true)};
$('fPaid').onclick=()=>{state.paid=!state.paid;$('fPaid').setAttribute('aria-pressed',state.paid);refresh(true)};
document.querySelectorAll('.pchip[data-lang]').forEach(b=>b.onclick=()=>{const l=b.dataset.lang;state.langs.has(l)?state.langs.delete(l):state.langs.add(l);b.setAttribute('aria-pressed',state.langs.has(l));refresh(false)});
$('needPay').onclick=()=>{state.needPay=!state.needPay;$('needPay').setAttribute('aria-pressed',state.needPay);refresh(false)};
let qT;$('q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{state.q=e.target.value.trim().toLowerCase();refresh(true)},150)});
$('sheet').onclick=()=>{const up=$('list').classList.toggle('up');$('sheet').setAttribute('aria-expanded',up);$('sheet').textContent=up?'Fechar':'Ver lista'};
$('nPais').textContent=new Set(PROGS.map(p=>p.country)).size;

function renderList(){const vis=PROGS.filter(matches).map(p=>({p,f:fit(p)})).sort((a,b)=>b.f.s-a.f.s||a.p.city.localeCompare(b.p.city));
 $('nList').textContent=vis.length;$('nProg').textContent=vis.length;
 $('cards').innerHTML=vis.slice(0,60).map((x,i)=>'<button type="button" class="card" data-id="'+x.p.id+'"><span class="rk">#'+(i+1)+'</span><span class="nm">'+x.p.city+' · '+x.p.country+'</span><span class="sc">'+x.f.s+'</span>'+
  '<span class="meta"><i class="sw" style="background:'+AREAS[x.p.area].c+'"></i>'+AREAS[x.p.area].n+' · '+x.p.dur+' meses · '+(x.p.st==='aberta'?'aberta':x.p.st)+'</span></button>').join('')||'<p class="note">Nenhum programa com esses filtros.</p>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openFicha(+c.dataset.id,true))}

function openFicha(id,fly){const p=PROGS[id];state.sel=id;const f=fit(p);
 $('drawer').innerHTML='<button class="x" type="button" id="close">Fechar</button>'+
 '<div><span class="tag">EXEMPLO</span></div><h3>'+p.name+'</h3>'+
 '<dl class="kv"><dt>Cidade</dt><dd>'+p.city+', '+p.country+'</dd><dt>Área</dt><dd><i class="sw" style="background:'+AREAS[p.area].c+'"></i> '+AREAS[p.area].n+'</dd>'+
 '<dt>Duração</dt><dd>'+p.dur+' meses</dd><dt>Bolsa</dt><dd>'+p.pay+'</dd><dt>Idioma</dt><dd>'+p.lang+'</dd><dt>Inscrições</dt><dd>'+p.st+'</dd><dt>Fonte</dt><dd>sem fonte (dado de exemplo)</dd></dl>'+
 '<div class="fit"><div>Encaixe com seu perfil</div><b>'+f.s+'/10</b><ul>'+f.why.map(w=>'<li>'+w+'</li>').join('')+'</ul></div>'+
 '<p class="note">Programa fictício, criado só para aprovar o visual do radar. Na versão real, cada ficha terá link oficial, trecho de evidência e data de verificação.</p>';
 $('drawer').classList.add('open');$('close').onclick=closeFicha;$('close').focus({preventScroll:true});
 if(fly){const pos=cur(p);flyTo(pos.x,pos.y)}
 if(innerWidth<=760){$('list').classList.remove('up');$('sheet').setAttribute('aria-expanded','false');$('sheet').textContent='Ver lista'}}
function closeFicha(){$('drawer').classList.remove('open');state.sel=null}
addEventListener('keydown',e=>{if(e.key==='Escape')closeFicha()});

// ---------- WebGL ----------
const stage=$('stage');
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'})}catch(e){}
if(!renderer){stage.insertAdjacentHTML('beforeend','<div class="nowebgl">Seu navegador não liberou WebGL. Use a lista de oportunidades.</div>');renderList();return}
const mobile=innerWidth<=760;
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));renderer.setClearColor(0x05070d,1);
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-6,6,3,-3,-10,10);cam.position.z=5;
const ctr=new THREE.OrbitControls(cam,renderer.domElement);
ctr.enableRotate=false;ctr.screenSpacePanning=true;ctr.enableDamping=true;ctr.minZoom=.6;ctr.maxZoom=7;
ctr.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};ctr.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN};

const U={uTime:{value:0},uSweep:{value:0},uMix:{value:0},uPx:{value:renderer.getPixelRatio()},uZoom:{value:1},uReduce:{value:reduce?1:0}};
const PI2=Math.PI*2;
// fundo: estrelas cintilando
(function(){const n=mobile?350:700,pos=new Float32Array(n*3),ph=new Float32Array(n);for(let i=0;i<n;i++){pos[i*3]=(rnd()-.5)*26;pos[i*3+1]=(rnd()-.5)*14;pos[i*3+2]=-1;ph[i]=rnd()*6.28}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
 const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:'attribute float aPh;uniform float uTime,uPx,uReduce;varying float vA;void main(){vA=uReduce>.5?.35:.18+.32*(.5+.5*sin(uTime*1.3+aPh*3.));gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_PointSize=1.6*uPx;}',
  fragmentShader:'varying float vA;void main(){float r=length(gl_PointCoord-.5)*2.;gl_FragColor=vec4(vec3(.75,.85,1.)*vA*(1.-r),1.);}'});
 scene.add(new THREE.Points(g,m))})();

// varredura + grade do radar (plano com shader)
const sweep=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:'varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`varying vec2 vP;uniform float uSweep,uTime,uReduce;
 void main(){float r=length(vP);float a=atan(vP.y,vP.x);float d=mod(uSweep-a,6.2831853);
  float fade=smoothstep(9.5,.5,r);
  float trail=exp(-d*2.6)*.30*fade;float beam=exp(-d*140.)*1.1*fade;
  if(uReduce>.5){trail=0.;beam=0.;}
  float rr=abs(fract(r/1.3+.5)-.5)*1.3;float ring=smoothstep(.018,0.,rr)*(.10+.04*sin(uTime*1.4-r*.8))*fade;
  float sec=3.14159265/6.;float sa=abs(fract(a/sec+.5)-.5)*sec*r;float spoke=smoothstep(.012,0.,sa)*.045*fade*step(.3,r);
  vec3 c=vec3(.35,.84,1.)*(trail+beam)+vec3(.35,.6,.9)*(ring+spoke);
  gl_FragColor=vec4(c,1.);}`}));
sweep.position.z=-.5;scene.add(sweep);

// continentes em pontos (Natural Earth, domínio público)
const nL=LAND.length/2;
(function(){const pos=new Float32Array(nL*3),ph=new Float32Array(nL);for(let i=0;i<nL;i++){pos[i*3]=LAND[i*2]/300;pos[i*3+1]=LAND[i*2+1]/300;pos[i*3+2]=-.2;ph[i]=rnd()*6.28}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aPh',new THREE.BufferAttribute(ph,1));
 const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aPh;uniform float uTime,uSweep,uPx,uZoom,uMix,uReduce;varying float vA;
  void main(){float a=atan(position.y,position.x);float d=mod(uSweep-a,6.2831853);float ping=uReduce>.5?0.:exp(-d*3.);
   vA=(.42+.10*sin(uTime*.9+aPh)+.9*ping)*(1.-uMix);
   gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_PointSize=(2.2+.6*uZoom)*uPx;}`,
  fragmentShader:'varying float vA;void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.)discard;gl_FragColor=vec4(vec3(.32,.55,.85)*vA*(1.-r*.6),1.);}'});
 scene.add(new THREE.Points(g,m))})();

// programas
const N=PROGS.length;
const centers={};AK.forEach((k,i)=>{const a=i/AK.length*PI2+.4;centers[k]=[Math.cos(a)*2.3,Math.sin(a)*1.6]});
function gauss(){return (rnd()+rnd()+rnd()-1.5)}
const geoA=new Float32Array(N*2),galA=new Float32Array(N*2),colA=new Float32Array(N*3),sizeA=new Float32Array(N),openA=new Float32Array(N),phA=new Float32Array(N),dimA=new Float32Array(N),selA=new Float32Array(N);
PROGS.forEach((p,i)=>{geoA[i*2]=p.lon/30;geoA[i*2+1]=p.lat/30;const c=centers[p.area];
 const sp=.38+(p.dur/24)*.25;galA[i*2]=c[0]+gauss()*sp;galA[i*2+1]=c[1]+gauss()*sp*.8;
 const col=new THREE.Color(AREAS[p.area].c);colA.set([col.r,col.g,col.b],i*3);
 sizeA[i]=p.dur===6?9:p.dur===12?12.5:16;openA[i]=p.st==='aberta'?1:0;phA[i]=rnd();});
function geom(){const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
 g.setAttribute('aGeo',new THREE.BufferAttribute(geoA,2));g.setAttribute('aGal',new THREE.BufferAttribute(galA,2));
 g.setAttribute('aCol',new THREE.BufferAttribute(colA,3));g.setAttribute('aSize',new THREE.BufferAttribute(sizeA,1));
 g.setAttribute('aOpen',new THREE.BufferAttribute(openA,1));g.setAttribute('aPh',new THREE.BufferAttribute(phA,1));
 g.setAttribute('aDim',new THREE.BufferAttribute(dimA,1));g.setAttribute('aSel',new THREE.BufferAttribute(selA,1));
 g.boundingSphere=new THREE.Sphere(new THREE.Vector3(),100);return g}
const VCOMMON=`attribute vec2 aGeo,aGal;attribute vec3 aCol;attribute float aSize,aOpen,aPh,aDim,aSel;
 uniform float uTime,uSweep,uMix,uPx,uZoom,uReduce;varying vec3 vCol;varying float vB;varying float vT;
 float ease(float t){return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)/2.;}`;
const progMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:VCOMMON+`void main(){vec2 p=mix(aGeo,aGal,ease(uMix));float a=atan(p.y,p.x);float d=mod(uSweep-a,6.2831853);
  float ping=uReduce>.5?0.:exp(-d*2.2);
  vB=(.55+1.7*ping+aSel*1.2)*(1.-aDim*.88);vCol=aCol;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,0.,1.);
  gl_PointSize=aSize*uPx*(1.+.5*ping+aSel*.6)*(.8+.2*min(uZoom,3.));}`,
 fragmentShader:'varying vec3 vCol;varying float vB;void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.)discard;float g=exp(-r*r*5.);float core=smoothstep(.35,.0,r);gl_FragColor=vec4((vCol*g+vec3(1.)*core*.55)*vB,1.);}'});
const progPts=new THREE.Points(geom(),progMat);scene.add(progPts);
const ringMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:VCOMMON+`void main(){vec2 p=mix(aGeo,aGal,ease(uMix));vT=fract(uTime*.45+aPh);
  vB=aOpen*(1.-vT)*(1.-aDim)*(uReduce>.5?0.:1.);vCol=aCol;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,0.,1.);gl_PointSize=aSize*uPx*(1.2+4.*vT);}`,
 fragmentShader:'varying vec3 vCol;varying float vB;void main(){float r=length(gl_PointCoord-.5)*2.;float ring=smoothstep(.78,.9,r)*smoothstep(1.,.92,r);gl_FragColor=vec4(vCol*ring*vB*.9,1.);}'});
const ringPts=new THREE.Points(progPts.geometry,ringMat);scene.add(ringPts);

// pós-processamento: brilho (bloom)
const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,cam));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(256,256),mobile?.8:1.0,.55,.05);composer.addPass(bloom);

function fitCam(){const w=stage.clientWidth,h=stage.clientHeight,asp=w/h;let hh=asp<1?3.1:Math.max(2.9,6.3/asp);const hw=hh*asp;
 cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix();renderer.setSize(w,h,false);composer.setSize(w,h);
 bloom.resolution.set(w*(mobile?.5:1),h*(mobile?.5:1))}
new ResizeObserver(fitCam).observe(stage);fitCam();
if(innerWidth<=760){cam.position.x=-1.6;ctr.target.x=-1.6;cam.position.y=.6;ctr.target.y=.6}

// rótulos das constelações (modo Galáxia)
const glabels=AK.map(k=>{const d=document.createElement('div');d.className='glabel';d.style.color=AREAS[k].c;d.textContent=AREAS[k].n;stage.appendChild(d);return d});

function refresh(boost){PROGS.forEach((p,i)=>dimA[i]=matches(p)?0:1);progPts.geometry.attributes.aDim.needsUpdate=true;renderList();if(boost)state.boost=1.6}
function cur(p){const i=p.id,t=state.mix<.5?4*state.mix**3:1-Math.pow(-2*state.mix+2,3)/2;return {x:geoA[i*2]+(galA[i*2]-geoA[i*2])*t,y:geoA[i*2+1]+(galA[i*2+1]-geoA[i*2+1])*t}}
const v3=new THREE.Vector3();
function toScreen(x,y){v3.set(x,y,0).project(cam);return [(v3.x+1)/2*stage.clientWidth,(1-v3.y)/2*stage.clientHeight]}
function pick(cx,cy,maxd){const r=renderer.domElement.getBoundingClientRect();const mx=cx-r.left,my=cy-r.top;let best=null,bd=maxd;
 PROGS.forEach(p=>{if(dimA[p.id])return;const c=cur(p);const s=toScreen(c.x,c.y);const d=Math.hypot(s[0]-mx,s[1]-my);if(d<bd){bd=d;best=p}});return best?{p:best,mx,my}:null}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const h=pick(e.clientX,e.clientY,22);if(h)openFicha(h.p.id,false);else closeFicha()});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const h=pick(e.clientX,e.clientY,14);const t=$('tip');
 if(!h){t.hidden=true;renderer.domElement.style.cursor='grab';return}renderer.domElement.style.cursor='pointer';
 t.innerHTML=h.p.city+' · '+h.p.country+'<small>'+AREAS[h.p.area].n+' · '+h.p.dur+' meses · EXEMPLO</small>';t.style.left=h.mx+'px';t.style.top=h.my+'px';t.hidden=false});
renderer.domElement.addEventListener('pointerleave',()=>$('tip').hidden=true);

let fly=null;function flyTo(x,y){fly={x0:ctr.target.x,y0:ctr.target.y,x,y,t:0}}
function setMode(g){state.mixT=g?1:0;$('mWorld').setAttribute('aria-pressed',!g);$('mGal').setAttribute('aria-pressed',g);
 if(g){flyTo(0,0)}}
$('mWorld').onclick=()=>setMode(false);$('mGal').onclick=()=>setMode(true);

// loop
const clock=new THREE.Clock();let frames=0,acc=0;window.__radar={fps:0,get angle(){return U.uSweep.value}};
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1);U.uTime.value+=dt;
 frames++;acc+=dt;if(acc>=1){window.__radar.fps=Math.round(frames/acc);frames=0;acc=0}
 if(!reduce){const speed=PI2/6*(1+state.boost*1.8);U.uSweep.value=(U.uSweep.value+speed*dt)%PI2}
 state.boost=Math.max(0,state.boost-dt);
 const ms=reduce?1:dt/1.2;if(state.mix<state.mixT)state.mix=Math.min(state.mixT,state.mix+ms);else if(state.mix>state.mixT)state.mix=Math.max(state.mixT,state.mix-ms);U.uMix.value=state.mix;
 if(fly){fly.t=Math.min(1,fly.t+(reduce?1:dt/0.8));const e=1-Math.pow(1-fly.t,3);const nx=fly.x0+(fly.x-fly.x0)*e,ny=fly.y0+(fly.y-fly.y0)*e;
  cam.position.x+=nx-ctr.target.x;cam.position.y+=ny-ctr.target.y;ctr.target.set(nx,ny,0);if(fly.t>=1)fly=null}
 PROGS.forEach((p,i)=>selA[i]=state.sel===i?1:0);progPts.geometry.attributes.aSel.needsUpdate=true;
 U.uZoom.value=cam.zoom;ctr.update();
 const ga=Math.max(0,state.mix*2-1);glabels.forEach((d,i)=>{const c=centers[AK[i]];const s=toScreen(c[0],c[1]+1.25);d.style.left=s[0]+'px';d.style.top=s[1]+'px';d.style.opacity=ga});
 composer.render()}
refresh(false);loop();
})();
</script>
