<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meio Ambiente · jev-ods-subtopicos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0E17; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 24px 16px; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p.desc { color: #94A3B8; font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
  .menu { background: #0F172A; border: 1px solid #1E293B; border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; display: grid; gap: 6px; }
  .menu .g { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 12.5px; }
  .menu .t { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #64748B; font-weight: 700; min-width: 100%; }
  .menu a { color: #60A5FA; text-decoration: none; }
  .menu a:hover { text-decoration: underline; }
  .menu .bts { display: flex; flex-wrap: wrap; gap: 8px; }
  .menu a.bt { background: #10264A; border: 1px solid #2563EB; color: #BFDBFE; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; text-decoration: none; }
  .menu a.bt:hover { background: #1E3A8A; color: #F8FAFC; }
  .menu a.bt.on { background: #2563EB; color: #F8FAFC; font-weight: 800; }
  #status { font-size: 13px; color: #9ca3af; margin: 6px 0 14px; }
  label.tog { font-size: 13px; color: #CBD5E1; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .item { background: #111C33; border: 1px solid #1E293B; border-left: 4px solid #2563EB; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .item.resto { border-left-color: #334155; }
  .pos { font-family: ui-monospace, Consolas, monospace; font-size: 20px; font-weight: 800; color: #93C5FD; }
  .resto .pos { color: #64748B; font-size: 15px; }
  .topo { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .art { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 15px; }
  .grp { display: block; font-size: 11px; color: #67E8F9; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .imp { font-size: 11.5px; font-weight: 700; color: #93C5FD; background: #10264A; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .partes { display: grid; gap: 4px; }
  .partes p { font-size: 14px; line-height: 1.55; color: #E2E8F0; white-space: pre-wrap; }
  .partes p.sub { padding-left: 16px; color: #CBD5E1; }
  details summary { cursor: pointer; font-size: 12.5px; color: #60A5FA; margin-top: 6px; }
  .cards { display: grid; gap: 10px; }
  .card { display: block; background: #111C33; border: 1px solid #1E293B; border-left: 4px solid #2563EB; border-radius: 8px; padding: 12px 16px; color: #F8FAFC; text-decoration: none; }
  .card:hover { border-color: #2563EB; }
  .card small { color: #94A3B8; font-size: 12.5px; display: block; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <nav class="menu" id="menu"></nav>
  <h1 id="tit">jev-ods-subtopicos</h1>
  <p class="desc" id="desc"></p>
  <div id="ctrl"><label class="tog"><input type="checkbox" id="todos"> Mostrar todos os itens</label></div>
  <div id="status">Carregando…</div>
  <div id="lista"></div>
</main>
<script>
const SLUG = 'jev-ods-subtopicos';
const $ = (id) => document.getElementById(id);
let dados = null;
function esc(t) { return String(t).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
function fmt(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function partes(it) {
  const ps = it.partes.map((p, i) => `<p class="${i ? 'sub' : ''}">${fmt(p)}</p>`);
  if (ps.length <= 6) return `<div class="partes">${ps.join('')}</div>`;
  return `<div class="partes">${ps.slice(0, 5).join('')}</div><details><summary>ver o item inteiro (${ps.length} partes)</summary><div class="partes">${ps.slice(5).join('')}</div></details>`;
}
function menu(indice) {
  $('menu').innerHTML = `<div class="t">Meio Ambiente · um botão por arquivo da pasta</div><div class="bts">`
    + `<a href="https://jev-ranker.vercel.app/" class="bt">← jev-ranker</a><a href="/" class="bt ${SLUG ? '' : 'on'}">início</a>`
    + indice.map((f) => `<a href="/${f.slug}" class="bt ${f.slug === SLUG ? 'on' : ''}">${esc(f.arquivo.replace(/\.json$/, ''))}</a>`).join('')
    + '</div>';
}
function renderiza() {
  const ord = [...dados.itens].sort((a, b) => (b.importancia || 0) - (a.importancia || 0));
  const vis = $('todos').checked ? ord : ord.slice(0, 20);
  $('status').textContent = `${dados.itens.length} ${dados.tipo === 'artigo' ? 'artigos' : 'itens'} avaliados; mostrando ${vis.length}, do mais importante para o menos.`;
  $('lista').innerHTML = vis.map((it, i) => `<div class="item ${i < 20 ? '' : 'resto'}">
    <div class="pos">${i + 1}</div>
    <div><div class="topo"><span class="art">${(() => { const s = it.titulo.split(' › '); const g = [it.grupo, ...s.slice(0, -1)].filter(Boolean).join(' › '); return (g ? `<span class="grp">${esc(g)}</span>` : '') + esc(s[s.length - 1]); })()}</span>
    <span class="imp">peso na prova ${it.importancia != null ? Math.round(it.importancia * 100) + '%' : '—'}</span></div>
    ${partes(it)}</div></div>`).join('');
}
fetch('/dados/indice.json').then((r) => r.json()).then((indice) => {
  if (!SLUG) {
    $('ctrl').style.display = 'none';
    $('desc').textContent = 'Cada arquivo da pasta Meio Ambiente virou uma página. O Jev avaliou item por item pelo peso na prova do TCE-SP (objetiva de auditoria e estudos de caso). Em cada página, os 20 mais importantes aparecem em destaque.';
    $('status').textContent = `${indice.length} arquivos · ${indice.reduce((s, f) => s + f.n, 0)} itens avaliados`;
    $('lista').innerHTML = `<div class="cards">${indice.map((f) => `<a class="card" href="/${f.slug}"><b>${esc(f.arquivo.replace(/\.json$/, ''))}</b><small>${esc(f.titulo)} · ${f.n} itens</small></a>`).join('')}</div>`;
    return;
  }
  return fetch(`/dados/${SLUG}.json`).then((r) => r.json()).then((d) => {
    dados = d;
    $('desc').textContent = `Arquivo ${d.arquivo}. Cada item foi avaliado pelo Jev pelo peso na prova do TCE-SP: objetiva de auditoria e estudos de caso. Os 20 primeiros aparecem em destaque.`;
    renderiza();
  });
}).catch((e) => { $('status').textContent = 'Erro: ' + e.message; });
$('todos').addEventListener('change', () => dados && renderiza());
</script>
<script src="/menu.js"></script>
</body>
</html>
