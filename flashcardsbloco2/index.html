 "Lei 13.460/2017, art. 7º, §2º, IV.", "op": ""}, {"d": 8, "t": "v", "sec": "3. Carta de Serviços ao Usuário", "q": "A Carta deve detalhar as prioridades de atendimento e a previsão de tempo de espera.", "g": "CERTO", "src": "Lei 13.460/2017, art. 7º, §3º.", "op": ""}, {"d": 8, "t": "v", "sec": "3. Carta de Serviços ao Usuário", "q": "A Carta de Serviços é facultativa para os Municípios.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 7º.", "op": "OP3: os órgãos e entidades abrangidos divulgarão a Carta"}, {"d": 8, "t": "v", "sec": "3. Carta de Serviços ao Usuário", "q": "A Carta fixa o prazo mínimo para a prestação do serviço.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 7º, §2º, IV.", "op": "OP2: prazo máximo"}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A ouvidoria encaminha a decisão final em 20 dias, prorrogáveis por mais 10.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 16.", "op": "OP1: 30 dias, prorrogáveis por igual período (20 + 10 é o prazo da LAI)"}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A ouvidoria pode recusar a manifestação feita verbalmente.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 10, §4º.", "op": "OP3: pode ser verbal, reduzida a termo"}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A ouvidoria deve encaminhar a decisão administrativa final ao usuário em 30 dias, prorrogável uma única vez por igual período.", "g": "CERTO", "src": "Lei 13.460/2017, art. 16.", "op": ""}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A ouvidoria pode solicitar informações a agentes, que respondem em 30 dias.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 16, parágrafo único.", "op": "OP1: 20 dias, prorrogáveis uma vez"}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A ouvidoria deve promover a adoção de mediação e conciliação entre o usuário e o órgão.", "g": "CERTO", "src": "Lei 13.460/2017, art. 13, VII.", "op": ""}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A identificação do requerente é informação pessoal protegida, com restrição de acesso.", "g": "CERTO", "src": "Lei 13.460/2017, art. 10, §7º.", "op": ""}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "O relatório de gestão da ouvidoria é elaborado a cada 2 anos.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 14, II.", "op": "OP1: anualmente"}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "São vedadas exigências relativas aos motivos determinantes da manifestação.", "g": "CERTO", "src": "Lei 13.460/2017, art. 10, §2º.", "op": ""}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "A manifestação deve ser dirigida ao Prefeito.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 10.", "op": "OP2: à ouvidoria do órgão responsável"}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "As solicitações da ouvidoria a agentes do órgão devem ser respondidas em 20 dias, prorrogáveis uma vez por igual período.", "g": "CERTO", "src": "Lei 13.460/2017, art. 16, parágrafo único.", "op": ""}, {"d": 8, "t": "v", "sec": "4. Manifestações e ouvidoria", "q": "Em nenhuma hipótese será recusado o recebimento de manifestações, sob pena de responsabilidade do agente público.", "g": "CERTO", "src": "Lei 13.460/2017, art. 11.", "op": ""}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "O conselho de usuários indica e nomeia o ouvidor.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 20.", "op": "OP3: só pode ser consultado"}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "A participação do usuário no conselho é serviço relevante e sem remuneração.", "g": "CERTO", "src": "Lei 13.460/2017, art. 21.", "op": ""}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "Para os Municípios com mais de 500 mil habitantes, a lei entrou em vigor em 720 dias.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 25.", "op": "OP1: 360 dias (720 é para menos de 100 mil)"}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "A pesquisa de satisfação é feita a cada 2 anos.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 23, §1º.", "op": "OP1: no mínimo a cada 1 ano"}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "Os conselhos de usuários são órgãos consultivos.", "g": "CERTO", "src": "Lei 13.460/2017, art. 18, parágrafo único.", "op": ""}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "O resultado da avaliação é publicado integralmente no site, com ranking das entidades com mais reclamações.", "g": "CERTO", "src": "Lei 13.460/2017, art. 23, §2º.", "op": ""}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "Os conselhos de usuários são órgãos deliberativos.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 18, parágrafo único.", "op": "OP2: consultivos"}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "A participação no conselho de usuários é remunerada por jeton.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 21.", "op": "OP3: serviço relevante e sem remuneração"}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "O conselho pode ser consultado sobre a indicação do ouvidor.", "g": "CERTO", "src": "Lei 13.460/2017, art. 20.", "op": ""}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "Para os Municípios entre 100 mil e 500 mil habitantes, a lei entrou em vigor em 360 dias.", "g": "ERRADO", "src": "Lei 13.460/2017, art. 25.", "op": "OP1: 540 dias (360 é para União, Estados, DF e Municípios com mais de 500 mil)"}, {"d": 8, "t": "v", "sec": "5. Conselhos de usuários, avaliação e vigência", "q": "A pesquisa de satisfação é feita, no mínimo, a cada ano.", "g": "CERTO", "src": "Lei 13.460/2017, art. 23, §1º.", "op": ""}, {"d": 9, "t": "c", "sec": "1. Abrangência e princípios", "q": "Município: só se <span class=\"blank\">__________<\/span>.", "a": "Município: só se <b class=\"ans\">adotar por ato normativo próprio<\/b>."}, {"d": 9, "t": "c", "sec": "1. Abrangência e princípios", "q": "Estatal que <span class=\"blank\">__________<\/span>: fora da lei.", "a": "Estatal que <b class=\"ans\">não presta serviço público<\/b>: fora da lei."}, {"d": 9, "t": "c", "sec": "1. Abrangência e princípios", "q": "Digital <span class=\"blank\">__________<\/span> o atendimento presencial.", "a": "Digital <b class=\"ans\">não elimina<\/b> o atendimento presencial."}, {"d": 9, "t": "c", "sec": "2. Processo e documento digital", "q": "Prazo eletrônico: <span class=\"blank\">_________<\/span> do último dia, <span class=\"blank\">__________<\/span>.", "a": "Prazo eletrônico: <b class=\"ans\">até 23h59<\/b> do último dia, <b class=\"ans\">horário de Brasília<\/b>."}, {"d": 9, "t": "c", "sec": "2. Processo e documento digital", "q": "Nato-digital assinado = <span class=\"blank\">________<\/span>.", "a": "Nato-digital assinado = <b class=\"ans\">original<\/b>."}, {"d": 9, "t": "c", "sec": "2. Processo e documento digital", "q": "Documento do usuário assinado eletronicamente: <span class=\"blank\">__________<\/span>.", "a": "Documento do usuário assinado eletronicamente: <b class=\"ans\">autenticidade presumida<\/b>."}, {"d": 9, "t": "c", "sec": "3. Plataformas de Governo Digital e direitos do usuário", "q": "Componentes: <span class=\"blank\">__________<\/span>.", "a": "Componentes: <b class=\"ans\">Base Nacional + Cartas + Plataformas<\/b>."}, {"d": 9, "t": "c", "sec": "3. Plataformas de Governo Digital e direitos do usuário", "q": "Painel: <span class=\"blank\">__________<\/span>.", "a": "Painel: <b class=\"ans\">quantidade, tempo médio, satisfação<\/b>."}, {"d": 9, "t": "c", "sec": "3. Plataformas de Governo Digital e direitos do usuário", "q": "Acesso às Plataformas: <span class=\"blank\">________<\/span>.", "a": "Acesso às Plataformas: <b class=\"ans\">gratuito<\/b>."}, {"d": 9, "t": "c", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "Pedido de abertura de base: <span class=\"blank\">__________<\/span> (20 + 10).", "a": "Pedido de abertura de base: <b class=\"ans\">prazos da LAI<\/b> (20 + 10)."}, {"d": 9, "t": "c", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "Intimação eletrônica: <span class=\"blank\">__________<\/span>, revogável sem motivo.", "a": "Intimação eletrônica: <b class=\"ans\">opção do usuário<\/b>, revogável sem motivo."}, {"d": 9, "t": "c", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "CPF/CNPJ <span class=\"blank\">______<\/span> para identificar; inscrição <span class=\"blank\">________<\/span>.", "a": "CPF/CNPJ <b class=\"ans\">bastam<\/b> para identificar; inscrição <b class=\"ans\">gratuita<\/b>."}, {"d": 9, "t": "c", "sec": "5. Laboratórios de inovação, governança e vigência", "q": "Laboratório de inovação: <span class=\"blank\">__________<\/span> e <span class=\"blank\">__________<\/span>.", "a": "Laboratório de inovação: <b class=\"ans\">facultativo<\/b> e <b class=\"ans\">aberto à sociedade<\/b>."}, {"d": 9, "t": "c", "sec": "5. Laboratórios de inovação, governança e vigência", "q": "Vigência: <span class=\"blank\">__________<\/span> dias (União · Estados · Municípios).", "a": "Vigência: <b class=\"ans\">90 · 120 · 180<\/b> dias (União · Estados · Municípios)."}, {"d": 9, "t": "c", "sec": "5. Laboratórios de inovação, governança e vigência", "q": "Auditoria interna: <span class=\"blank\">__________<\/span>, independente.", "a": "Auditoria interna: <b class=\"ans\">baseada em risco<\/b>, independente."}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "A LGPD não se aplica ao Poder Público.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 1º e art. 23.", "op": "OP3: aplica-se às pessoas jurídicas de direito público"}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "A LGPD se aplica ao tratamento realizado para fins exclusivamente jornalísticos.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 4º, II.", "op": "OP3: não se aplica"}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "O dado anonimizado não é considerado dado pessoal, salvo se a anonimização puder ser revertida com esforços razoáveis.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 12.", "op": ""}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "O controlador é a quem competem as decisões referentes ao tratamento, e o operador trata os dados em nome do controlador.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 5º, VI e VII.", "op": ""}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "O dado referente à saúde é dado pessoal comum.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 5º, II.", "op": "OP2: dado sensível"}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "A LGPD protege também os dados de pessoas jurídicas.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 1º e art. 5º, I.", "op": "OP3: só pessoa natural"}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "A LGPD protege os dados pessoais da pessoa natural, e suas normas gerais obrigam União, Estados, DF e Municípios.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 1º.", "op": ""}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "A LGPD não se aplica ao tratamento realizado por pessoa natural para fins exclusivamente particulares e não econômicos.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 4º, I.", "op": ""}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "O encarregado é agente de tratamento, ao lado do controlador e do operador.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 5º, IX.", "op": "OP2: agentes de tratamento são só o controlador e o operador"}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "O operador é a pessoa a quem competem as decisões sobre o tratamento de dados.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 5º, VI e VII.", "op": "OP2: é o controlador"}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "Os dados biométricos e genéticos vinculados a uma pessoa são dados pessoais sensíveis.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 5º, II.", "op": ""}, {"d": 9, "t": "v", "sec": "1. Alcance e conceitos", "q": "O CPF e o endereço residencial são dados pessoais sensíveis.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 5º, I e II.", "op": "OP2: são dados pessoais comuns"}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "Pelo princípio da necessidade, o tratamento se limita ao mínimo necessário para a realização de suas finalidades.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 6º, III.", "op": ""}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "O princípio da transparência dispensa a informação sobre quem são os agentes de tratamento.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 6º, VI.", "op": "OP4: garante informações sobre o tratamento e os agentes"}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "O princípio da segurança consiste na adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 6º, VII e VIII.", "op": "OP2: isso é prevenção; segurança protege contra acessos não autorizados e incidentes"}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "O princípio da prevenção consiste na adoção de medidas para prevenir a ocorrência de danos.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 6º, VIII.", "op": ""}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "O livre acesso garante ao titular consulta facilitada e gratuita sobre a forma e a duração do tratamento.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 6º, IV.", "op": ""}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "O livre acesso permite a cobrança de taxa pela consulta aos dados do titular.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 6º, IV.", "op": "OP3: consulta gratuita"}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "A finalidade exige propósitos legítimos, específicos, explícitos e informados ao titular.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 6º, I.", "op": ""}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "A qualidade dos dados garante aos titulares exatidão, clareza, relevância e atualização dos dados.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 6º, V.", "op": ""}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "O princípio da adequação limita o tratamento ao mínimo necessário para as finalidades.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 6º, II e III.", "op": "OP2: isso é necessidade; adequação é a compatibilidade com a finalidade informada"}, {"d": 9, "t": "v", "sec": "2. Princípios", "q": "A responsabilização e prestação de contas exige que o agente demonstre medidas eficazes e capazes de comprovar o cumprimento das normas.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 6º, X.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O tratamento de dado sensível por consentimento exige que ele seja específico e destacado, para finalidades específicas.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 11, I.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O Poder Público só pode tratar dados pessoais com o consentimento do titular.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 7º.", "op": "OP3: há outras bases, como política pública e obrigação legal"}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "Cabe ao controlador o ônus da prova de que o consentimento foi obtido conforme a lei.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 8º, §2º.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O dado sensível nunca pode ser tratado sem o consentimento do titular.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 11, II.", "op": "OP3: há hipóteses sem consentimento, como obrigação legal e políticas públicas"}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O Poder Público pode tratar dados para a execução de políticas públicas previstas em leis e regulamentos, sem consentimento do titular.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 7º, III.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O consentimento pode ser revogado a qualquer momento, por procedimento gratuito e facilitado.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 8º, §5º.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O legítimo interesse não é base legal para o tratamento de dados na LGPD.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 7º, IX.", "op": "OP4: é uma das hipóteses do art. 7º"}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "As autorizações genéricas para o tratamento de dados pessoais são válidas se assinadas.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 8º, §4º.", "op": "OP3: são nulas"}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "Findo o tratamento, os dados são eliminados, autorizada a conservação para cumprir obrigação legal ou regulatória.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 16.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O tratamento de dados de criança exige o consentimento de ambos os pais.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 14, §1º.", "op": "OP1: de pelo menos um dos pais ou do responsável legal"}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O consentimento escrito deve constar de cláusula destacada das demais cláusulas contratuais.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 8º, §1º.", "op": ""}, {"d": 9, "t": "v", "sec": "3. Bases legais e consentimento", "q": "O consentimento para dado sensível pode ser genérico, para todas as finalidades.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 11, I.", "op": "OP3: específico e destacado, para finalidades específicas"}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "Os prazos para o titular exercer direitos perante o Poder Público observam a legislação específica, como Habeas Data, Lei 9.784 e LAI.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 23, §3º.", "op": ""}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "É em regra vedado ao Poder Público transferir a entidades privadas dados pessoais das bases a que tenha acesso.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 26, §1º.", "op": ""}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O Poder Público pode transferir livremente dados pessoais a entidades privadas.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 26, §1º.", "op": "OP3: em regra vedado, com exceções"}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O órgão público deve informar as hipóteses em que trata dados pessoais e indicar um encarregado.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 23, I e III.", "op": ""}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O titular não pode peticionar contra o controlador perante a autoridade nacional.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 18, §1º.", "op": "OP3: pode"}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O atendimento aos direitos do titular é feito sem custos para ele.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 18, §5º.", "op": ""}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O atendimento ao requerimento do titular pode ser cobrado pelo controlador.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 18, §5º.", "op": "OP3: sem custos"}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O titular pode obter, a qualquer momento, a confirmação da existência de tratamento e o acesso aos dados.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 18, I e II.", "op": ""}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O titular pode pedir a portabilidade dos dados e a eliminação dos dados tratados com seu consentimento.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 18, V e VI.", "op": ""}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O órgão público é dispensado de indicar encarregado.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 23, III.", "op": "OP4: deve indicar encarregado"}, {"d": 9, "t": "v", "sec": "4. Direitos do titular e Poder Público", "q": "O titular não pode pedir a eliminação dos dados tratados com seu consentimento.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 18, VI.", "op": "OP3: pode, salvo as hipóteses do art. 16"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "O operador nunca responde pelos danos causados pelo tratamento.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 42.", "op": "OP3: responde solidariamente nas hipóteses do art. 42, §1º"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "O controlador deve comunicar à ANPD e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 48.", "op": ""}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A multa simples pode chegar a 5% do faturamento, limitada a R$ 100 milhões por infração.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 52, II.", "op": "OP1: 2% e R$ 50 milhões"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A suspensão do exercício da atividade de tratamento pode durar até 3 meses.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 52, XI.", "op": "OP1: até 6 meses, prorrogável"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A suspensão do banco de dados pode durar até 6 meses, prorrogável por igual período.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 52, X.", "op": ""}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "O juiz pode inverter o ônus da prova a favor do titular quando verossímil a alegação ou houver hipossuficiência.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 42, §2º.", "op": ""}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A ANPD pode aplicar multa a órgãos públicos.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 52, §3º.", "op": "OP3: as multas não se aplicam aos órgãos públicos (art. 52, §3º)"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A multa simples pode chegar a 2% do faturamento, limitada a R$ 50 milhões por infração.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 52, II.", "op": ""}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A LGPD não prevê multa diária.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 52.", "op": "OP4: prevê (art. 52, III)"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "O operador é quem comunica o incidente de segurança à ANPD.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 48.", "op": "OP2: o controlador"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "O operador responde solidariamente pelos danos quando descumprir a legislação ou não seguir as instruções lícitas do controlador.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 42, §1º, I.", "op": ""}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A suspensão do banco de dados pode durar até 1 ano, sem prorrogação.", "g": "ERRADO", "src": "Lei 13.709/2018 (LGPD), art. 52, X.", "op": "OP1: 6 meses, prorrogável por igual período"}, {"d": 9, "t": "v", "sec": "5. Segurança, incidentes, responsabilidade e sanções", "q": "A identidade e as informações de contato do encarregado devem ser divulgadas publicamente, de preferência no site do controlador.", "g": "CERTO", "src": "Lei 13.709/2018 (LGPD), art. 41, §1º.", "op": ""}, {"d": 10, "t": "c", "sec": "1. Princípios, governança e planejamento", "q": "Ordem: <span class=\"blank\">__________<\/span> (inversão só motivada e prevista no edital).", "a": "Ordem: <b class=\"ans\">julgamento antes da habilitação<\/b> (inversão só motivada e prevista no edital)."}, {"d": 10, "t": "c", "sec": "1. Princípios, governança e planejamento", "q": "ETP = <span class=\"blank\">__________<\/span>, escolhe a solução · TR = <span class=\"blank\">__________<\/span> · projeto básico = <span class=\"blank\">_____<\/span>.", "a": "ETP = <b class=\"ans\">primeira etapa<\/b>, escolhe a solução · TR = <b class=\"ans\">bens e serviços<\/b> · projeto básico = <b class=\"ans\">obras<\/b>."}, {"d": 10, "t": "c", "sec": "1. Princípios, governança e planejamento", "q": "Governança = <span class=\"blank\">__________<\/span>.", "a": "Governança = <b class=\"ans\">alta administração<\/b>."}, {"d": 10, "t": "c", "sec": "2. Orçamento, pesquisa de preços, matriz de riscos e reajuste", "q": "Obra: <span class=\"blank\">______<\/span> (edificação) · <span class=\"blank\">_____<\/span> (transporte) · + BDI e encargos.", "a": "Obra: <b class=\"ans\">SINAPI<\/b> (edificação) · <b class=\"ans\">SICRO<\/b> (transporte) · + BDI e encargos."}, {"d": 10, "t": "c", "sec": "2. Orçamento, pesquisa de preços, matriz de riscos e reajuste", "q": "Reajuste = <span class=\"blank\">______<\/span> · repactuação = <span class=\"blank\">__________<\/span> · revisão = <span class=\"blank\">__________<\/span>.", "a": "Reajuste = <b class=\"ans\">índice<\/b> · repactuação = <b class=\"ans\">mão de obra<\/b> · revisão = <b class=\"ans\">fato imprevisível<\/b>."}, {"d": 10, "t": "c", "sec": "2. Orçamento, pesquisa de preços, matriz de riscos e reajuste", "q": "Medir a mais que o executado = <span class=\"blank\">__________<\/span>.", "a": "Medir a mais que o executado = <b class=\"ans\">superfaturamento<\/b>."}, {"d": 10, "t": "c", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "Obra → <span class=\"blank\">__________<\/span> · serviço comum de engenharia → pode <span class=\"blank\">______<\/span>.", "a": "Obra → <b class=\"ans\">concorrência<\/b> · serviço comum de engenharia → pode <b class=\"ans\">pregão<\/b>."}, {"d": 10, "t": "c", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "Prazos de obra: <span class=\"blank\">__________<\/span> dias úteis (comum · especial · semi · integrada).", "a": "Prazos de obra: <b class=\"ans\">10 · 25 · 35 · 60<\/b> dias úteis (comum · especial · semi · integrada)."}, {"d": 10, "t": "c", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "Técnica e preço: técnica até <span class=\"blank\">____<\/span>.", "a": "Técnica e preço: técnica até <b class=\"ans\">70%<\/b>."}, {"d": 10, "t": "c", "sec": "4. Julgamento, habilitação, recursos, homologação e nulidades", "q": "Obra: <span class=\"blank\">_____<\/span> inexequível · <span class=\"blank\">_____<\/span> garantia adicional.", "a": "Obra: <b class=\"ans\"> inexequível · <b class=\"ans\"> garantia adicional."}, {"d": 10, "t": "c", "sec": "4. Julgamento, habilitação, recursos, homologação e nulidades", "q": "Atestado: parcela <span class=\"blank\">____<\/span> · exigência <span class=\"blank\">_____<\/span>.", "a": "Atestado: parcela <b class=\"ans\">≥ 4%<\/b> · exigência <b class=\"ans\">≤ 50%<\/b>."}, {"d": 10, "t": "c", "sec": "4. Julgamento, habilitação, recursos, homologação e nulidades", "q": "Recurso <span class=\"blank\">__________<\/span> · reconsideração <span class=\"blank\">____<\/span> · decisão <span class=\"blank\">____<\/span>.", "a": "Recurso <b class=\"ans\">3 dias úteis<\/b> · reconsideração <b class=\"ans\">3<\/b> · decisão <b class=\"ans\">10<\/b>."}, {"d": 10, "t": "c", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "<span class=\"blank\">__________<\/span> = não dá para competir · <span class=\"blank\">__________<\/span> = dá, mas a lei libera.", "a": "<b class=\"ans\">Inexigível<\/b> = não dá para competir · <b class=\"ans\">dispensável<\/b> = dá, mas a lei libera."}, {"d": 10, "t": "c", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Projeto e fiscalização de obra com notória especialização → <span class=\"blank\">__________<\/span>.", "a": "Projeto e fiscalização de obra com notória especialização → <b class=\"ans\">inexigibilidade<\/b>."}, {"d": 10, "t": "c", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Emergência: <span class=\"blank\">_____<\/span>, sem prorrogação.", "a": "Emergência: <b class=\"ans\">1 ano<\/b>, sem prorrogação."}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A lei não se aplica a empresas públicas e sociedades de economia mista que não prestem serviço público.", "g": "CERTO", "src": "Lei 14.129/2021, art. 2º, §1º.", "op": ""}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "Constitui diretriz a vedação de exigência de prova de fato já comprovado por documento ou informação válida.", "g": "CERTO", "src": "Lei 14.129/2021, art. 3º, XIII.", "op": ""}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A Lei 14.129 se aplica automaticamente a todos os Municípios.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 2º, III.", "op": "OP3: só se adotarem por ato normativo próprio"}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "Autosserviço é o acesso pelo cidadão a serviço público prestado por meio digital, sem necessidade de mediação humana.", "g": "CERTO", "src": "Lei 14.129/2021, art. 4º, II.", "op": ""}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "Governo como plataforma é o acesso a serviço público digital sem mediação humana.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 4º, II e VII.", "op": "OP2: isso é autosserviço"}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A Administração pode fazer novas exigências ao interessado a qualquer tempo, durante o serviço.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 3º, XII.", "op": "OP3: as exigências são impostas de uma única vez, salvo dúvida superveniente"}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A Lei 14.129 se aplica a Estados, DF e Municípios desde que adotem seus comandos por meio de atos normativos próprios.", "g": "CERTO", "src": "Lei 14.129/2021, art. 2º, III.", "op": ""}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A prestação digital dos serviços elimina o direito do cidadão ao atendimento presencial.", "g": "ERRADO", "src": "Lei 14.129/2021, arts. 3º, XVI, e 14.", "op": "OP3: permanece a possibilidade de atendimento presencial"}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "Transparência ativa é a disponibilização de dados pela administração independentemente de solicitações.", "g": "CERTO", "src": "Lei 14.129/2021, art. 4º, XI.", "op": ""}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A aplicação da Lei 14.129 dispensa a observância da LGPD.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 1º, parágrafo único.", "op": "OP3: deve-se observar a LAI, a 13.460, a LGPD, o CTN e a LC 105"}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A lei se aplica também às empresas estatais que não prestem serviço público.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 2º, §1º.", "op": "OP3: não se aplica"}, {"d": 10, "t": "v", "sec": "1. Abrangência, conceitos e princípios", "q": "A lei deve observar a LAI, a Lei 13.460, a LGPD, o CTN e a LC 105.", "g": "CERTO", "src": "Lei 14.129/2021, art. 1º, parágrafo único.", "op": ""}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "Os atos do processo eletrônico se fazem em meio eletrônico, salvo se o usuário pedir forma diversa, ou na indisponibilidade do sistema.", "g": "CERTO", "src": "Lei 14.129/2021, art. 6º.", "op": ""}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O documento nato-digital assinado eletronicamente é considerado original para todos os efeitos legais.", "g": "CERTO", "src": "Lei 14.129/2021, art. 11.", "op": ""}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O ato processual eletrônico é tempestivo se praticado até meia-noite do dia seguinte ao do prazo.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 8º, §1º.", "op": "OP1: até 23h59 do último dia"}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O ato eletrônico se considera realizado no dia e na hora do recebimento pelo sistema, que emite recibo eletrônico de protocolo.", "g": "CERTO", "src": "Lei 14.129/2021, art. 8º.", "op": ""}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "Presume-se a autenticidade dos documentos enviados por usuários por meio digital, desde que assinados eletronicamente.", "g": "CERTO", "src": "Lei 14.129/2021, art. 26.", "op": ""}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "A assinatura eletrônica exige o mesmo nível de segurança para qualquer documento.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 7º.", "op": "OP3: autenticidade, integridade e segurança proporcionais ao risco"}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O ato processual eletrônico é tempestivo se praticado até as 18h do último dia, horário local.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 8º, §1º.", "op": "OP1: 23h59, horário de Brasília"}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O ato processual eletrônico é tempestivo se praticado até as 23h59 do último dia do prazo, no horário de Brasília.", "g": "CERTO", "src": "Lei 14.129/2021, art. 8º, §1º.", "op": ""}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O processo eletrônico nunca admite a prática de atos em papel.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 6º.", "op": "OP3: admite nas exceções do art. 6º, com digitalização posterior"}, {"d": 10, "t": "v", "sec": "2. Processo e documento digital", "q": "O documento nato-digital assinado eletronicamente vale como cópia autenticada.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 11.", "op": "OP2: vale como original"}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "O acesso às Plataformas de Governo Digital pode ser cobrado do usuário.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 27, I.", "op": "OP3: gratuidade"}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "As Plataformas de Governo Digital devem ter ferramenta de solicitação e acompanhamento dos serviços e painel de monitoramento do desempenho.", "g": "CERTO", "src": "Lei 14.129/2021, art. 20.", "op": ""}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "O usuário tem direito a receber protocolo, físico ou digital, das solicitações e a indicar canal preferencial de comunicação.", "g": "CERTO", "src": "Lei 14.129/2021, art. 27, IV e V.", "op": ""}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "O painel de monitoramento deve informar o custo de cada atendimento.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 22.", "op": "OP4: traz solicitações, tempo médio e satisfação"}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "Os componentes essenciais são a Base Nacional de Serviços, as Cartas de Serviços e as Ouvidorias.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 18.", "op": "OP2: são as Plataformas de Governo Digital"}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "As plataformas devem ter sistema de ouvidoria, nos termos da Lei 13.460.", "g": "CERTO", "src": "Lei 14.129/2021, art. 21, XI.", "op": ""}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "O painel de monitoramento deve identificar nominalmente os servidores que atenderam.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 22.", "op": "OP4: não consta do conteúdo mínimo do painel"}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "Os componentes essenciais da prestação digital são a Base Nacional de Serviços Públicos, as Cartas de Serviços e as Plataformas de Governo Digital.", "g": "CERTO", "src": "Lei 14.129/2021, art. 18.", "op": ""}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "A Estratégia Nacional de Governo Digital é de adoção obrigatória por cada Município.", "g": "ERRADO", "src": "Lei 14.129/2021, arts. 15 e 16.", "op": "OP3: cada ente pode editar a sua, compatibilizando com a federal"}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "O painel de monitoramento traz, por serviço, as solicitações em andamento e concluídas no ano, o tempo médio de atendimento e o grau de satisfação.", "g": "CERTO", "src": "Lei 14.129/2021, art. 22.", "op": ""}, {"d": 10, "t": "v", "sec": "3. Plataformas e direitos do usuário", "q": "É direito do usuário a gratuidade no acesso às Plataformas de Governo Digital.", "g": "CERTO", "src": "Lei 14.129/2021, art. 27, I.", "op": ""}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "O custo de adaptação dos sistemas para a interoperabilidade é arcado pelo governo federal.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 41.", "op": "OP2: é de responsabilidade de cada órgão ou entidade"}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "Nova base de dados só pode ser criada quando esgotadas as possibilidades de uso dos registros de referência existentes.", "g": "CERTO", "src": "Lei 14.129/2021, art. 40, §2º.", "op": ""}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "As comunicações, notificações e intimações por meio eletrônico dependem de opção do usuário.", "g": "CERTO", "src": "Lei 14.129/2021, art. 42.", "op": ""}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "O usuário que optou pelo meio eletrônico só pode desistir mediante fundamentação.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 42, §2º.", "op": "OP3: pode optar pelo fim a qualquer momento, independentemente de fundamentação"}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "O CPF ou o CNPJ é número suficiente para a identificação do cidadão ou da pessoa jurídica nos bancos de dados de serviços públicos.", "g": "CERTO", "src": "Lei 14.129/2021, art. 28.", "op": ""}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "O número do CPF é facultativo na identificação do cidadão nos bancos de dados de serviços públicos.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 28.", "op": "OP3: é número suficiente de identificação"}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "O órgão pode criar nova base de dados sempre que julgar conveniente.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 40, §2º.", "op": "OP3: só quando esgotados os registros existentes"}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "Os dados de transparência ativa são de livre utilização pela sociedade.", "g": "CERTO", "src": "Lei 14.129/2021, art. 29.", "op": ""}, {"d": 10, "t": "v", "sec": "4. CPF, dados abertos, interoperabilidade e domicílio eletrônico", "q": "O pedido de abertura de base de dados segue os procedimentos e pr ": "v", "sec": "5. Inovação, governança e vigência", "q": "A auditoria interna planeja suas atividades por sorteio, sem considerar risco.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 49, II.", "op": "OP3: abordagem baseada em risco"}, {"d": 10, "t": "v", "sec": "5. Inovação, governança e vigência", "q": "O laboratório de inovação é obrigatório e restrito a servidores públicos.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 44.", "op": "OP3: facultativo e aberto à sociedade"}, {"d": 10, "t": "v", "sec": "5. Inovação, governança e vigência", "q": "Os entes públicos poderão instituir laboratórios de inovação, abertos à participação e colaboração da sociedade.", "g": "CERTO", "src": "Lei 14.129/2021, art. 44.", "op": ""}, {"d": 10, "t": "v", "sec": "5. Inovação, governança e vigência", "q": "O governo é proibido de custear o acesso e a conexão para o uso de serviços públicos.", "g": "ERRADO", "src": "Lei 14.129/2021, art. 50.", "op": "OP3: pode garantir, total ou parcialmente"}, {"d": 10, "t": "v", "sec": "5. Inovação, governança e vigência", "q": "O sistema de gestão de riscos e controle interno deve ter controles proporcionais aos riscos.", "g": "CERTO", "src": "Lei 14.129/2021, art. 48.", "op": ""}, {"d": 11, "t": "c", "sec": "1. LAI em Santos: SIC e três instâncias de recurso", "q": "Escada: <span class=\"blank\">__________<\/span> → <span class=\"blank\">__________<\/span> → <span class=\"blank\">__________<\/span>; cada recurso em <span class=\"blank\">_______<\/span>.", "a": "Escada: <b class=\"ans\">Secretário (5 dias)<\/b> → <b class=\"ans\">Ouvidoria e Controle (5 dias)<\/b> → <b class=\"ans\">CMRI (30 dias)<\/b>; cada recurso em <b class=\"ans\">10 dias<\/b>."}, {"d": 11, "t": "c", "sec": "1. LAI em Santos: SIC e três instâncias de recurso", "q": "Pedido: nome, <span class=\"blank\">____<\/span>, e-mail, descrição · genérico não é atendido.", "a": "Pedido: nome, <b class=\"ans\">CPF<\/b>, e-mail, descrição · genérico não é atendido."}, {"d": 11, "t": "c", " function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rebuild(){
 let l=DATA.cards.filter(c=>S.decks.has(c.d)&&(S.type=="all"||c.t==S.type));
 if(S.mode=="pend")l=l.filter(c=>prog[c.id]!==1);else if(S.mode=="err")l=l.filter(c=>prog[c.id]===0);

  h+='<div class="q">'+c.q+'</div>';
  if(S.answered==null)h+='<div class="btns"><button class="btn" onclick="ans(\'CERTO\')">CERTO</button><button class="btn" onclick="ans(\'ERRADO\')">ERRADO</button></div>';
  else{const ok=S.answered==c.g;h+='<div class="a"><div class="'+(ok?'ok':'no')+'">'+(ok?'Acertou':'Errou')+' · gabarito: '+c.g+'</div>'+(c.src?'<div class="src">'+c.src+'</div>':'')+(c.op?'<div class="pk">Pegadinha: '+c.op+'</div>':'')+'</div><div class="btns"><button class="btn c" onclick="mark('+(ok?1:0)+')">Próximo</button></div>'}
 }
 st.innerHTML=h+'</div>'
}
function flip(){S.flipped=true;render()}
function ans(x){S.answered=x;render()}
$("reset").onclick=()=>{if(confirm("Zerar todo o progresso?")){prog={};save();rebuild()}};
document.addEventListener("keydown",e=>{const c=S.queue[S.i];if(!c)return;const k=e.key.toLowerCase();
 if(c.t=="c"){if(k==" "){e.preventDefault();if(!S.flipped)flip()}else if(S.flipped&&k=="arrowright")mark(1);else if(S.flipped&&k=="arrowleft")mark(0)}
 else{if(S.answered==null){if(k=="c")ans("CERTO");if(k=="e")ans("ERRADO")}else if(k==" "||k=="arrowright"){e.preventDefault();mark(S.answered==c.g?1:0)}}});
rebuild();
</script></body></html>
