ativa popular.", "op": "OP3: o art. 37 não admite"}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "A venda ao vizinho de área remanescente de obra pública exige apenas avaliação e autorização legislativa.", "g": "CERTO", "src": "Lei Orgânica de Santos, art. 94, §2º.", "op": ""}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "O inventário de todos os bens municipais é enviado à Câmara a cada 4 anos.", "g": "ERRADO", "src": "Lei Orgânica de Santos, art. 95: inventário anual.", "op": "OP1: o inventário é anual"}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "A alienação de imóveis exige autorização legislativa e concorrência, que é dispensada na doação e na permuta.", "g": "CERTO", "src": "Lei Orgânica de Santos, art. 94.", "op": ""}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "A autorização de uso de bem público pode ser concedida por até 90 dias.", "g": "ERRADO", "src": "Lei Orgânica de Santos, art. 93: autorização por no máximo 60 dias.", "op": "OP1: máximo de 60 dias"}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "É vedado ao Município contratar obras ou serviços com empresa que descumpra as normas de saúde e segurança do trabalho.", "g": "CERTO", "src": "Lei Orgânica de Santos, art. 98.", "op": ""}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "A autorização de uso de bem público é feita por portaria, para uso transitório, pelo prazo máximo de 60 dias.", "g": "CERTO", "src": "Lei Orgânica de Santos, art. 93.", "op": ""}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "A concessão de bem de uso comum pode ser feita para qualquer fim comercial.", "g": "ERRADO", "src": "Lei Orgânica de Santos, art. 93.", "op": "OP3: só para fins escolares, de assistência social ou turísticos, com autorização legislativa"}, {"d": 1, "t": "v", "sec": "4. Bens, obras e serviços", "q": "A doação de imóvel dispensa também a avaliação prévia.", "g": "ERRADO", "src": "Lei Orgânica de San ank\">____<\/span> (chefias) · <span class=\"blank\">____<\/span> (chefe de departamento) · <span class=\"blank\">____<\/span> (secretário) · <span class=\"blank\">__________<\/span> (Prefeito).", "a": "Escada de competência: <b class=\"ans\">5<\/b> (chefias) · <b class=\"ans\">15<\/b> (chefe de departamento) · <b class=\"ans\">30<\/b> (secretário) · <b class=\"ans\">acima de 30, multa e demissão<\/b> (Prefeito)."}, {"d": 2, "t": "c", "sec": "4. Penas: o rol, quando cabe cada uma, quem aplica e a prescrição", "q": "À <span class=\"blank\">__________<\/span> pode caber qualquer pena, conforme a natureza (art. 240); a autoridade pode <span class=\"blank\">________<\/span> a pena (art. 237).", "a": "À <b class=\"ans\">primeira infração<\/b> pode caber qualquer pena, conforme a natureza (art. 240); a autoridade pode <b class=\"ans\">abrandar<\/b> a pena (art. 237)."}, {"d": 2, "t": "c", "sec": "4. Penas: o rol, quando cabe cada uma, quem aplica e a prescrição", "q": "Sob inquérito, o funcionário só pode ser <span class=\"blank\">__________<\/span> depois da absolvição ou do cumprimento da pena (art. 239).", "a": "Sob inquérito, o funcionário só pode ser <b class=\"ans\">exonerado a pedido<\/b> depois da absolvição ou do cumprimento da pena (art. 239)."}, {"d": 2, "t": "c", "sec": "4. Penas: o rol, quando cabe cada uma, quem aplica e a prescrição", "q": "<span class=\"blank\">__________<\/span> não existe no Estatuto de Santos (é da Lei 8.112, federal).", "a": "<b class=\"ans\">Advertência<\/b> não existe no Estatuto de Santos (é da Lei 8.112, federal)."}, {"d": 2, "t": "c", "sec": "5. Processo disciplinar: sindicância, processo sumário e inquérito", "q": "Pares perigosos: <span class=\"blank\">__________<\/span> × <span class=\"blank\">__________<\/span> × <span class=\"blank\">__________<\/span>.", "a": "Pares perigosos: <b class=\"ans\">sindicância 30 dias<\/b> × <b class=\"ans\">inquérito 90 dias<\/b> × <b class=\"ans\">suspensão preventiva até 90 dias<\/b>."}, {"d": 2, "t": "c", "sec": "5. Processo disciplinar: sindicância, processo sumário e inquérito", "q": "<span class=\"blank\">__________<\/span> não tem contraditório; o <span class=\"blank\">_________<\/span> tem citação, defesa e revelia (com devolução do prazo de defesa).", "a": "<b class=\"ans\">Sindicância<\/b> não tem contraditório; o <b class=\"ans\">inquérito<\/b> tem citação, defesa e revelia (com devolução do prazo de defesa)."}, {"d": 2, "t": "c", "sec": "5. Processo disciplinar: sindicância, processo sumário e inquérito", "q": "Prazos do Estatuto em <span class=\"blank\">__________<\/span>, excluindo o do começo e incluindo o do fim (art. 274).", "a": "Prazos do Estatuto em <b class=\"ans\">dias corridos<\/b>, excluindo o do começo e incluindo o do fim (art. 274)."}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A perda do cargo do estável por avaliação periódica de desempenho dispensa ampla defesa.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 23.", "op": "OP3: exige ampla defesa"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A estabilidade exige 3 anos de efetivo exercício e aprovação no estágio probatório.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 22 (LC 1.163/2022).", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O funcionário que não tomar posse no prazo é exonerado.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 29: ato tornado sem efeito.", "op": "OP2: o ato fica sem efeito; a exoneração é de quem não entra em exercício"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "Não tomando posse no prazo, o ato de provimento é tornado sem efeito.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 29.", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "Não há posse na nomeação para cargo efetivo.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 28.", "op": "OP3: não há posse na promoção nem na reintegração; na nomeação há"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "Entre os requisitos de investidura está ter 21 anos completos.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 13.", "op": "OP1: 18 anos"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A aprovação em concurso não cria direito à nomeação, mas a nomeação deve seguir a ordem de classificação.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 19.", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A aprovação no concurso garante a nomeação do candidato.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 19.", "op": "OP3: não cria direito à nomeação"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O estável só perde o cargo por sentença judicial transitada em julgado.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 23 (LC 1.163/2022).", "op": "OP3: também por processo administrativo e por avaliação periódica de desempenho, com ampla defesa"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O concurso tem validade de até 2 anos da homologação, prorrogável por igual período.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 19.", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A posse deve ocorrer em 30 dias da publicação do ato de provimento, prorrogável por igual período.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 28.", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A posse deve ocorrer em 15 dias da publicação do ato de provimento.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 28.", "op": "OP1: art. 28: 30 dias, prorrogáveis por igual período"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O funcionário não estável pode ser exonerado por inassiduidade, ineficiência, indisciplina, insubordinação, falta de dedicação ou má conduta, com defesa em 10 dias.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 24.", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O funcionário adquire estabilidade após 2 anos de efetivo exercício.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 22 com a redação da LC 1.163/2022.", "op": "OP1: texto antigo; hoje são 3 anos e aprovação no estágio"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "A prorrogação do prazo para entrar em exercício pode chegar a 60 dias.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 52.", "op": "OP1: até 30 dias"}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O exercício deve começar em 30 dias contados da posse, e quem não entrar em exercício é exonerado.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 52.", "op": ""}, {"d": 2, "t": "v", "sec": "1. Ingresso: provimento, posse, exercício e estabilidade", "q": "O prazo para entrar em exercício conta da publicação do ato de provimento.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 52: 30 dias da posse.", "op": "OP2: conta da posse"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "As férias podem ser acumuladas por até 3 anos consecutivos.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 172.", "op": "OP1: no máximo 2 anos consecutivos, e só por absoluta necessidade"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "O direito ao gozo da licença-prêmio não prescreve.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 199.", "op": ""}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "Perde a licença-prêmio do quinquênio o funcionário que sofreu repreensão.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 201.", "op": "OP2: a perda é por suspensão"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença por doença na família pode chegar a 24 meses, integral até 6 meses.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), LC 1.163/2022.", "op": "OP1: texto antigo; hoje 12 meses, integral até 3"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença-prêmio é de 3 meses a cada quinquênio de exercício ininterrupto.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 199.", "op": ""}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença para interesses particulares só é concedida a funcionário estável, após 3 anos.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), LC 1.163/2022.", "op": ""}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "Os consignados em folha podem chegar a 50% do líquido.", "g": "ERRADO", "src": "LC 1.195/2023.", "op": "OP1: 40%"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença-saúde por doença comum é reavaliada pela junta médica a cada 6 meses.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), LC 1.163/2022.", "op": "OP1: a cada 3 meses"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "As férias são de 30 dias corridos e o direito nasce após o primeiro ano de exercício.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 172.", "op": ""}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "O direito ao gozo da licença-prêmio prescreve em 5 anos.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 199.", "op": "OP1: não prescreve"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A proibição de acumular férias vale também para cargo em comissão.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 172.", "op": "OP3: não vale para cargo em comissão"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "Perde a licença-prêmio do quinquênio o funcionário que sofreu suspensão.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 201.", "op": ""}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença para interesses particulares exige 2 anos de exercício e não depende de estabilidade.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), LC 1.163/2022.", "op": "OP1: 3 anos e estabilidade"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "O direito às férias nasce após 6 meses de exercício.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 172.", "op": "OP1: primeiro ano"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "Os descontos consignados em folha não podem passar de 40% do líquido: 10% de cartão de crédito e 30% das demais operações.", "g": "CERTO", "src": "LC 1.195/2023.", "op": ""}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença-prêmio é de 6 meses a cada 10 anos de exercício.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 199.", "op": "OP1: 3 meses a cada 5 anos"}, {"d": 2, "t": "v", "sec": "2. Férias e licenças", "q": "A licença por doença na família é de no máximo 12 meses: integral até 3 meses, dois terços até 6 meses e sem remuneração do 7º ao 12º mês.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), LC 1.163/2022.", "op": ""}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "A condenação penal absorve a responsabilidade administrativa do funcionário.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), arts. 224 a 227.", "op": "OP3: as três são independentes"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "A responsabilidade civil, penal e administrativa do funcionário são independentes entre si.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), arts. 224 a 227.", "op": ""}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "A proibição de parentes sob ordens imediatas alcança até o 3º grau.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 223.", "op": "OP1: 2º grau"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "É vedado atribuir ao funcionário serviços diferentes dos do seu cargo, salvo chefia, direção e comissões.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 8º.", "op": ""}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "O funcionário que pagar a indenização do prejuízo fica isento da pena disciplinar.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 227.", "op": "OP3: o pagamento não exime da pena disciplinar"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "É dever do funcionário cumprir as ordens superiores, representando contra as manifestamente ilegais.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 222.", "op": ""}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "O funcionário deve cumprir todas as ordens superiores, inclusive as manifestamente ilegais.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 222.", "op": "OP3: o dever é representar contra as manifestamente ilegais"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "O funcionário deve residir no Município sem qualquer possibilidade de autorização em contrário.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 222.", "op": "OP3: ou perto, com autorização"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "O alcance, desfalque ou omissão de recolhimento deve ser reposto de uma só vez, com correção.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984).", "op": ""}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "O funcionário pode receber estipêndio de fornecedores desde que não os fiscalize pessoalmente.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 223.", "op": "OP4: é proibido receber de fornecedores ou de entidades fiscalizadas"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "O serviço gratuito é permitido ao funcionário quando previsto em portaria.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 11.", "op": "OP3: é vedado o serviço gratuito"}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "É proibido ao funcionário manter sob sua chefia imediata parentes até o 2º grau, ressalvada função de confiança, no máximo dois.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 223.", "op": ""}, {"d": 2, "t": "v", "sec": "3. Deveres, proibições e responsabilidade", "q": "A reposição em caso de desfalque pode ser parcelada livremente pelo funcionário.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984).", "op": "OP3: de uma só vez"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A cassação de aposentadoria pode ocorrer por falta grave apurada até 5 anos após a aposentadoria.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984).", "op": "OP1: até 180 dias"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A autoridade não pode abrandar a pena prevista.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 237.", "op": "OP3: pode abrandar"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "Constitui causa de demissão ter mais de 60 faltas interpoladas no ano.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 233.", "op": ""}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A pena de multa é aplicada pelo Secretário.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 241.", "op": "OP2: é do Prefeito"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A prescrição das penas de demissão é de 2 anos.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 243.", "op": "OP1: 5 anos"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "O abandono de cargo, para fins de demissão, ocorre com mais de 30 dias de ausência consecutiva.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 233.", "op": ""}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A suspensão pode chegar a 90 dias.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984).", "op": ""}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "Os Chefes de Departamento aplicam suspensão de até 30 dias.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 241.", "op": "OP1: até 15 dias; 30 dias é dos Secretários"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "Os Chefes de Departamento aplicam penas até suspensão de 15 dias, e as demais chefias, repreensão e suspensão até 5 dias.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 241.", "op": ""}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "O prazo prescricional conta da data do fato.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 243.", "op": "OP2: conta do conhecimento pela autoridade"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "O rol de penalidades inclui repreensão, suspensão, multa, demissão, demissão a bem do serviço público e cassação de aposentadoria ou disponibilidade.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 228.", "op": ""}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A advertência escrita integra o rol de penalidades do Estatuto de Santos.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 228.", "op": "OP4: advertência não existe no Estatuto de Santos"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A suspensão pode chegar a 120 dias.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984).", "op": "OP1: até 90 dias"}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "A prescrição é de 2 anos para repreensão, multa e suspensão, e de 5 anos para as demais penas.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 243.", "op": ""}, {"d": 2, "t": "v", "sec": "4. Penas: rol, competência e prescrição", "q": "Os Secretários podem aplicar a pena de demissão.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 241.", "op": "OP2: demissão, multa e suspensão acima de 30 dias são do Prefeito"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A defesa escrita no inquérito é apresentada em 5 dias.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 255 e seguintes.", "op": "OP1: 10 dias"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A suspensão preventiva se prorroga até o fim do processo.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 246.", "op": "OP3: cessa em 90 dias"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A autoridade que sabe de irregularidade no serviço é obrigada a promover a apuração.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 249.", "op": ""}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "O inquérito administrativo deve ser concluído em 60 dias, sem possibilidade de prorrogação.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), arts. 255 a 265.", "op": "OP1: 90 dias, prorrogável"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "O processo sumário é cabível quando a falta não comporta demissão, com defesa em 5 dias.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 250.", "op": ""}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "O inquérito administrativo começa em 10 dias do recebimento dos autos.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 255 e seguintes.", "op": "OP1: 5 dias"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A sindicância assegura contraditório e ampla defesa ao funcionário.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), arts. 251 a 254.", "op": "OP3: é sigilosa e sem contraditório"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "O inquérito administrativo deve estar concluído em 90 dias, prorrogável com justificativa.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), arts. 255 a 265.", "op": ""}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A sindicância tem prazo de 60 dias para concluir.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), arts. 251 a 254.", "op": "OP1: 30 dias"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A suspensão preventiva pode durar até 90 dias, com perda de um terço do vencimento, devolvido se não houver punição.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 246.", "op": ""}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "Os prazos do Estatuto são contados em dias úteis.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 274.", "op": "OP2: dias corridos, excluído o do começo e incluído o do fim"}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A Comissão Processante é de funcionários efetivos e presidida por bacharel em Direito inscrito na OAB.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), art. 255.", "op": ""}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A sindicância é peça preliminar e informativa, sem contraditório, e conclui em 30 dias.", "g": "CERTO", "src": "Estatuto (Lei 4.623/1984), arts. 251 a 254.", "op": ""}, {"d": 2, "t": "v", "sec": "5. Processo disciplinar", "q": "A pena de demissão pode ser aplicada em processo sumário.", "g": "ERRADO", "src": "Estatuto (Lei 4.623/1984), art. 250.", "op": "OP3: o sumário é para falta que não comporta demissão"}, {"d": 3, "t": "c", "sec": "1. Princípios e conceitos (arts. 1º a 5º)", "q": "<span class=\"blank\">_____<\/span> não tem personalidade jurídica; <span class=\"blank\">________<\/span> tem.", "a": "<b class=\"ans\">Órgão<\/b> não tem personalidade jurídica; <b class=\"ans\">entidade<\/b> tem."}, {"d": 3, "t": "c", "sec": "1. Princípios e conceitos (arts. 1º a 5º)", "q": "Pares perigosos: unidade administrativa → atribuiçõe  "Doutrina majoritária.", "op": ""}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "A perda da função pública atinge todos os vínculos do agente com o Poder Público.", "g": "ERRADO", "src": "Lei 8.429/1992, art. 12, §1º.", "op": "OP3: só o vínculo da mesma natureza"}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "A aprovação das contas pelo Tribunal de Contas afasta a improbidade.", "g": "ERRADO", "src": "Lei 8.429/1992, art. 21.", "op": "OP3: as sanções independem da aprovação ou rejeição das contas"}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "O rol de condutas do art. 11 é taxativo.", "g": "CERTO", "src": "Lei 8.429/1992, art. 11.", "op": ""}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "No ato que causa lesão ao erário, a suspensão dos direitos políticos chega a 14 anos.", "g": "ERRADO", "src": "Lei 8.429/1992, art. 12, II.", "op": "OP1: até 12 anos"}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "Frustrar a licitude de licitação ou dispensá-la indevidamente, com perda patrimonial efetiva, é improbidade do art. 10.", "g": "CERTO", "src": "Lei 8.429/1992, art. 10, VIII.", "op": ""}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "O rol do art. 11 é meramente exemplificativo.", "g": "ERRADO", "src": "Lei 8.429/1992, art. 11.", "op": "OP3: taxativo"}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "A improbidade administrativa só se configura mediante conduta dolosa.", "g": "CERTO", "src": "Lei 8.429/1992, art. 1º.", "op": ""}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "No enriquecimento ilícito, a suspensão dos direitos políticos chega a 10 anos.", "g": "ERRADO", "src": "Lei 8.429/1992, art. 12, I.", "op": "OP1: até 14 anos"}, {"d": 4, "t": "v", "sec": "4. Improbidade: dolo, tipos e sanções", "q": "Na violação de princípios, a multa chega a 100 vezes nde solidariamente com a equipe de apoio por todos os atos.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 8º, §1º.", "op": "OP3: responde individualmente, salvo se induzido a erro pela equipe"}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "A segregação de funções admite a designação do mesmo agente para funções de maior risco simultaneamente.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 7º, §1º.", "op": "OP3: vedada"}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "A contratação de terceiros para assistir o fiscal não elimina a responsabilidade do fiscal, nos limites das informações recebidas.", "g": "CERTO", "src": "Lei 14.133/2021, art. 117, §4º, II.", "op": ""}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "A empresa contratada para assistir o fiscal pode exercer atribuição exclusiva do fiscal do contrato.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 117, §4º, I.", "op": "OP4: não pode exercer atribuição própria e exclusiva de fiscal"}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "O fiscal do contrato anota em registro próprio todas as ocorrências e determina a regularização das faltas observadas.", "g": "CERTO", "src": "Lei 14.133/2021, art. 117, §1º.", "op": ""}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "As funções essenciais à execução da lei devem ser atribuídas, preferencialmente, a servidor efetivo ou empregado público dos quadros permanentes.", "g": "CERTO", "src": "Lei 14.133/2021, art. 7º, I.", "op": ""}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "O agente de contratação pode ser qualquer pessoa de confiança da autoridade, ainda que sem vínculo efetivo.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 8º.", "op": "OP4: deve ser servidor efetivo ou empregado permanente"}, {"d": 5, "t": "v", "sec": "1. Agentes e fiscal do contrato", "q": "A comissão de contratação tem no mínimo 3 membros, que respondem solidariamente pelo idade e pagamento", "q": "O contratado responde pela solidez da obra por 2 anos após o recebimento definitivo.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 140, §6º.", "op": "OP1: no mínimo 5 anos"}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "O contratado responde por no mínimo 5 anos, de forma objetiva, pela solidez e segurança da obra após o recebimento definitivo.", "g": "CERTO", "src": "Lei 14.133/2021, art. 140, §6º.", "op": ""}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "O recebimento definitivo de obra é feito pelo fiscal do contrato.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 140, I, b.", "op": "OP2: por servidor ou comissão designada pela autoridade"}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "O recebimento provisório de obra é feito pelo responsável pelo acompanhamento e fiscalização.", "g": "CERTO", "src": "Lei 14.133/2021, art. 140, I, a.", "op": ""}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "O projetista responde subjetivamente pelos danos de falha de projeto.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 140, §5º.", "op": "OP3: responsabilidade objetiva"}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "O pagamento obedece à ordem cronológica por fonte de recurso, nas categorias fornecimento, locações, serviços e obras.", "g": "CERTO", "src": "Lei 14.133/2021, art. 141.", "op": ""}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "A ordem cronológica de pagamentos vale apenas para obras.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 141.", "op": "OP3: vale para fornecimento, locações, serviços e obras"}, {"d": 5, "t": "v", "sec": "4. Recebimento, responsabilidade e pagamento", "q": "O recebimento da obra não exclui a responsabilidade civil pela solidez e segurança.", "g": "CERTO", "src": "Lei 14.133/2021, art. 140, §2º.", "op": ""}, {" <\/b>."}, {"d": 6, "t": "c", "sec": "5. Responsabilidades", "q": "Servidor que nega sem fundamento: <span class=\"blank\">__________<\/span> + possível <span class=\"blank\">__________<\/span>.", "a": "Servidor que nega sem fundamento: <b class=\"ans\">disciplinar<\/b> + possível <b class=\"ans\">improbidade<\/b>."}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "O plano de contratações anual é obrigatório para todos os órgãos.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 12, VII.", "op": "OP4: os órgãos poderão elaborar, na forma de regulamento"}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "A fase preparatória deve compatibilizar-se com o plano de contratações anual, quando elaborado, e com as leis orçamentárias.", "g": "CERTO", "src": "Lei 14.133/2021, art. 18.", "op": ""}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "O processo licitatório tem por objetivo selecionar a proposta mais vantajosa, inclusive quanto ao ciclo de vida do objeto.", "g": "CERTO", "src": "Lei 14.133/2021, art. 11, I.", "op": ""}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "A licitação presencial dispensa gravação da sessão.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 17, §§2º e 5º.", "op": "OP3: sessão gravada em áudio e vídeo"}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "A governança das contratações é responsabilidade da alta administração do órgão ou entidade.", "g": "CERTO", "src": "Lei 14.133/2021, art. 11, parágrafo único.", "op": ""}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "O objetivo do processo licitatório é sempre contratar pelo menor preço.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 11, I.", "op": "OP3: é a proposta apta a gerar o resultado mais vantajoso, considerado o ciclo de vida"}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "A governança das contratações é responsabilidade do agente de contratação.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 11, parágrafo único.", "op": "OP2: da alta administração"}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "As licitações são realizadas preferencialmente na forma eletrônica; a presencial exige motivação e gravação em áudio e vídeo.", "g": "CERTO", "src": "Lei 14.133/2021, art. 17, §§2º e 5º.", "op": ""}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "As fases da licitação são preparatória, divulgação do edital, propostas e lances, julgamento, habilitação, recursal e homologação.", "g": "CERTO", "src": "Lei 14.133/2021, art. 17.", "op": ""}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "O estudo técnico preliminar é elaborado depois do termo de referência.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 6º, XX.", "op": "OP3: é a primeira etapa do planejamento"}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "O estudo técnico preliminar caracteriza o interesse público e a melhor solução, e dá base ao anteprojeto, ao termo de referência ou ao projeto básico.", "g": "CERTO", "src": "Lei 14.133/2021, art. 6º, XX.", "op": ""}, {"d": 6, "t": "v", "sec": "1. Princípios, governança e planejamento", "q": "A fase de habilitação precede sempre a de julgamento.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 17, §1º.", "op": "OP3: a habilitação só antecede se houver ato motivado e previsão no edital"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "Em obras de edificação, o SICRO é o sistema de custos de referência prioritário.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 23, §2º, I.", "op": "OP2: o SICRO é para infraestrutura de transportes; para as demais obras, o SINAPI"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "O superfaturamento é o dano ao patrimônio da Administração, caracterizado, por exemplo, pela medição de quantidades superiores às executadas.", "g": "CERTO", "src": "Lei 14.133/2021, art. 6º, LVII.", "op": ""}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A pesquisa direta aceita orçamentos obtidos com até 12 meses de antecedência do edital.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 23, §1º, IV.", "op": "OP1: 6 meses"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A data-base do reajuste é a da apresentação da proposta pelo licitante, em qualquer caso.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 25, §7º.", "op": "OP2: vinculada à data do orçamento estimado"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "O orçamento estimado pode ser sigiloso, mas o sigilo não prevalece para os órgãos de controle interno e externo.", "g": "CERTO", "src": "Lei 14.133/2021, art. 24.", "op": ""}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A repactuação é a aplicação de índice de correção monetária prevista no contrato.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 6º, LVIII e LIX.", "op": "OP2: isso é reajustamento em sentido estrito"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "O sobrepreço é o dano causado pela medição de quantidades superiores às executadas.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 6º, LVI e LVII.", "op": "OP2: isso é superfaturamento; sobrepreço é preço orçado ou contratado acima do mercado"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "Em obras, o valor estimado é acrescido do BDI de referência e dos encargos sociais e definido, primeiro, pela mediana do SICRO ou do SINAPI.", "g": "CERTO", "src": "Lei 14.133/2021, art. 23, §2º.", "op": ""}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "Em obras, as contratações similares consideradas são as dos últimos 2 anos.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 23, §2º, III.", "op": "OP1: 1 ano anterior à pesquisa"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A pesquisa direta com fornecedores exige no mínimo 2 orçamentos.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 23, §1º, IV.", "op": "OP1: no mínimo 3"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A matriz de riscos é obrigatória em obras de grande vulto e nas contratações integrada e semi-integrada.", "g": "CERTO", "src": "Lei 14.133/2021, art. 22, §3º.", "op": ""}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A pesquisa direta com fornecedores exige no mínimo 3 fornecedores, com orçamentos de até 6 meses antes do edital.", "g": "CERTO", "src": "Lei 14.133/2021, art. 23, §1º, IV.", "op": ""}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A matriz de riscos é facultativa na contratação integrada.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 22, §3º.", "op": "OP3: obrigatória"}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "A repactuação é a forma de manter o equilíbrio em serviços contínuos com dedicação exclusiva ou predominância de mão de obra.", "g": "CERTO", "src": "Lei 14.133/2021, art. 6º, LIX.", "op": ""}, {"d": 6, "t": "v", "sec": "2. Orçamento, pesquisa de preços, riscos e reajuste", "q": "O orçamento sigiloso também pode ser negado ao Tribunal de Contas.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 24, I.", "op": "OP3: o sigilo não vale para o controle"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O leilão adota o critério de menor preço.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 33, V.", "op": "OP2: maior lance"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "As modalidades de licitação são pregão, concorrência, concurso, leilão e diálogo competitivo.", "g": "CERTO", "src": "Lei 14.133/2021, art. 28.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O prazo mínimo de apresentação de propostas, para obras e serviços comuns de engenharia por menor preço, é de 10 dias úteis.", "g": "CERTO", "src": "Lei 14.133/2021, art. 55, II, a.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "A tomada de preços e o convite são modalidades previstas na Lei 14.133.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 28.", "op": "OP4: não existem mais"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "No julgamento por técnica e preço, a proposta técnica pode ter valoração de até 80%.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 36, §2º.", "op": "OP1: máximo de 70%"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "É vedada a criação de outras modalidades de licitação ou a combinação das existentes.", "g": "CERTO", "src": "Lei 14.133/2021, art. 28, §2º.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O pregão pode ser usado para a licitação de obras de engenharia.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 29, parágrafo único.", "op": "OP4: não se aplica a obras"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O pregão é obrigatório para bens e serviços comuns e cabe também para serviços comuns de engenharia.", "g": "CERTO", "src": "Lei 14.133/2021, arts. 6º, XLI, e 29.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O prazo mínimo na contratação semi-integrada é de 60 dias úteis.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 55, II, d.", "op": "OP1: 35 dias úteis"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "No diálogo competitivo, o prazo mínimo para manifestação de interesse é de 10 dias úteis.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 32, §1º, I.", "op": "OP1: 25 dias úteis"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "No julgamento por técnica e preço, a proposta técnica pode ter valoração máxima de 70%.", "g": "CERTO", "src": "Lei 14.133/2021, art. 36, §2º.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O prazo mínimo de propostas na contratação integrada é de 35 dias úteis.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 55, II, c e d.", "op": "OP1: 60 dias úteis (35 é a semi-integrada)"}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O modo de disputa exclusivamente fechado é vedado quando o critério é menor preço ou maior desconto.", "g": "CERTO", "src": "Lei 14.133/2021, art. 56, §1º.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "A concorrência é a modalidade para obras e serviços comuns e especiais de engenharia.", "g": "CERTO", "src": "Lei 14.133/2021, art. 6º, XXXVIII.", "op": ""}, {"d": 6, "t": "v", "sec": "3. Modalidades, critérios de julgamento e prazos", "q": "O modo de disputa aberto é permitido no julgamento por técnica e preço.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 56, §2º.", "op": "OP3: vedado"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "Em obras, exige-se garantia adicional do vencedor cuja proposta for inferior a 75% do orçado.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 59, §§4º e 5º.", "op": "OP1: 85% (75% é o limite de inexequibilidade)"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "Em obras, exige-se garantia adicional do vencedor cuja proposta for inferior a 85% do valor orçado, igual à diferença.", "g": "CERTO", "src": "Lei 14.133/2021, art. 59, §5º.", "op": ""}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A habilitação divide-se em jurídica, técnica, fiscal, social e trabalhista, e econômico-financeira.", "g": "CERTO", "src": "Lei 14.133/2021, art. 62.", "op": ""}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "O prazo de recurso contra a habilitação é de 5 dias úteis.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 165, I.", "op": "OP1: 3 dias úteis"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A exigência de atestados pode impor quantidades mínimas de até 80% das parcelas relevantes.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 67, §2º.", "op": "OP1: até 50%"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A exigência de atestados se restringe às parcelas de maior relevância, de valor individual igual ou superior a 4% do total estimado.", "g": "CERTO", "src": "Lei 14.133/2021, art. 67, §1º.", "op": ""}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "Em obras e serviços de engenharia, são inexequíveis as propostas inferiores a 75% do valor orçado pela Administração.", "g": "CERTO", "src": "Lei 14.133/2021, art. 59, §4º.", "op": ""}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A exigência de atestados se limita às parcelas de valor igual ou superior a 10% do total.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 67, §1º.", "op": "OP1: 4%"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A declaração de nulidade do contrato exige análise prévia do interesse público e não exonera a Administração de indenizar o executado.", "g": "CERTO", "src": "Lei 14.133/2021, arts. 147 a 149.", "op": ""}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "O pedido de reconsideração é feito em 5 dias úteis.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 165, II.", "op": "OP1: 3 dias úteis"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "O prazo de recurso contra o julgamento das propostas é de 3 dias úteis.", "g": "CERTO", "src": "Lei 14.133/2021, art. 165, I.", "op": ""}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A revogação da licitação decorre de ilegalidade insanável.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 71.", "op": "OP2: isso é anulação; revogação é por conveniência e oportunidade, com fato superveniente"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "Em obras de engenharia, são inexequíveis as propostas inferiores a 70% do valor orçado.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 59, §4º.", "op": "OP1: 75%"}, {"d": 6, "t": "v", "sec": "4. Julgamento, habilitação, recursos e nulidades", "q": "A autoridade superior decide o recurso em até 10 dias úteis do recebimento dos autos.", "g": "CERTO", "src": "Lei 14.133/2021, art. 165, §2º.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Para a contratação por inexigibilidade de fornecedor exclusivo, o atestado de exclusividade é dispensável.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 74, §1º.", "op": "OP4: a inviabilidade de competição deve ser demonstrada por atestado ou documento idôneo"}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Na dispensa por emergência ou calamidade, a contratação é limitada às parcelas que possam ser concluídas em até 1 ano, vedada a prorrogação.", "g": "CERTO", "src": "Lei 14.133/2021, art. 75, VIII.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Estudos técnicos, projetos básicos e executivos e fiscalização, supervisão ou gerenciamento de obras podem ser contratados por inexigibilidade, havendo notória especialização.", "g": "CERTO", "src": "Lei 14.133/2021, art. 74, III.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "A dispensa por licitação deserta exige que a contratação ocorra em até 6 meses da licitação anterior.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 75, III.", "op": "OP1: menos de 1 ano"}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "A inexigibilidade é admitida para serviços de publicidade e divulgação.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 74, III.", "op": "OP3: é vedada"}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "É dispensável a licitação para obras e serviços de engenharia de valor inferior a R$ 100 mil (valor do texto da lei, atualizado por decreto).", "g": "CERTO", "src": "Lei 14.133/2021, art. 75, I.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Para aferir os limites da dispensa por valor, soma-se o gasto do exercício na unidade gestora com objetos de mesma natureza.", "g": "CERTO", "src": "Lei 14.133/2021, art. 75, §1º.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "O contrato firmado por dispensa de emergência pode ser prorrogado e a mesma empresa recontratada.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 75, VIII.", "op": "OP3: vedadas a prorrogação e a recontratação"}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "O processo de contratação direta deve conter a razão da escolha do contratado, a justificativa de preço e a autorização da autoridade competente.", "g": "CERTO", "src": "Lei 14.133/2021, art. 72.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "A dispensa por valor para obras e serviços de engenharia vale para valores inferiores a R$ 50 mil.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 75, I e II.", "op": "OP1: R$ 100 mil para obras; R$ 50 mil para outros serviços e compras"}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "É inexigível a licitação quando inviável a competição, como na contratação de serviços técnicos especializados de natureza predominantemente intelectual, com notória especialização.", "g": "CERTO", "src": "Lei 14.133/2021, art. 74.", "op": ""}, {"d": 6, "t": "v", "sec": "5. Contratação direta: dispensa e inexigibilidade", "q": "Para aferir o limite da dispensa, considera-se apenas o valor de cada contratação isolada.", "g": "ERRADO", "src": "Lei 14.133/2021, art. 75, §1º.", "op": "OP3: soma-se o exercício, contra o fracionamento"}, {"d": 7, "t": "c", "sec": "1. Abrangência, conceitos e princípios", "q": "Concessionária: lei <span class=\"blank\">__________<\/span>; relação de consumo: <span class=\"blank\">__________<\/span>.", "a": "Concessionária: lei <b class=\"ans\">subsidiária<\/b>; relação de consumo: <b class=\"ans\">CDC também<\/b>."}, {"d": 7, "t": "c", "sec": "1. Abrangência, conceitos e princípios", "q": "Usuário <span class=\"blank\">_________<\/span> também é usuário.", "a": "Usuário <b class=\"ans\">potencial<\/b> também é usuário."}, {"d": 7, "t": "c", "sec": "1. Abrangência, conceitos e princípios", "q": "Elogio também é <span class=\"blank\">__________<\/span>.", "a": "Elogio também é <b class=\"ans\">manifestação<\/b>."}, {"d": 7, "t": "c", "sec": "2. Diretrizes do atendimento e direitos do usuário", "q": "Firma: <span class=\"blank\">______<\/span>, salvo <span class=\"blank\">__________<\/span> · original: o <span class=\"blank\">__________<\/span> autentica.", "a": "Firma: <b class=\"ans\">vedada<\/b>, salvo <b class=\"ans\">dúvida de autenticidade<\/b> · original: o <b class=\"ans\">próprio agente<\/b> autentica."}, {"d": 7, "t": "c", "sec": "2. Diretrizes do atendimento e direitos do usuário", "q": "Corte: nunca começa em <span class=\"blank\">__________<\/span>.", "a": "Corte: nunca começa em <b class=\"ans\">sexta, fim de semana, feriado ou véspera<\/b>."}, {"d": 7, "t": "c", "sec": "2. Diretrizes do atendimento e direitos do usuário", "q": "Usuário também tem <span class=\"blank\">_______<\/span> (art. 8º).", "a": "Usuário também tem <b class=\"ans\">deveres<\/b> (art. 8º)."}, {"d": 7, "t": "c", "sec": "3. Carta de Serviços ao Usuário", "q": "Carta = <span class=\"blank\">__________<\/span>.", "a": "Carta = <b class=\"ans\">serviços + como acessar + prazo máximo + padrões de qualidade<\/b>."}, {"d": 7, "t": "c", "sec": "3. Carta de Serviços ao Usuário", "q": "Publicada no <span class=\"blank\">____<\/span>, atualizada periodicamente.", "a": "Publicada no <b class=\"ans\">site<\/b>, atualizada periodicamente."}, {"d": 7, "t": "c", "sec": "4. Manifestações e ouvidoria", "q": "Ouvidoria: <span class=\"blank\">_______<\/span> · agente responde à ouvidoria: <span class=\"blank\">_______<\/span> · LAI: <span class=\"blank\">_______<\/span>.", "a": "Ouvidoria: <b class=\"ans\">30 + 30<\/b> · agente responde à ouvidoria: <b class=\"ans\">20 + 20<\/b> · LAI: <b class=\"ans\">20 + 10<\/b>."}, {"d": 7, "t": "c", "sec": "4. Manifestações e ouvidoria", "q": "Manifestação <span class=\"blank\">__________<\/span>; pode ser <span class=\"blank\">______<\/span>.", "a": "Manifestação <b class=\"ans\">nunca é recusada<\/b>; pode ser <b class=\"ans\">verbal<\/b>."}, {"d": 7, "t": "c", "sec": "4. Manifestações e ouvidoria", "q": "Relatório de gestão: <span class=\"blank\">_____<\/span>, à autoridade máxima e na internet.", "a": "Relatório de gestão: <b class=\"ans\">anual<\/b>, à autoridade máxima e na internet."}, {"d": 7, "t": "c", "sec": "5. Conselhos de usuários e avaliação", "q": "Conselho: <span class=\"blank\">__________<\/span> e <span class=\"blank\">__________<\/span>.", "a": "Conselho: <b class=\"ans\">consultivo<\/b> e <b class=\"ans\">sem remuneração<\/b>."}, {"d": 7, "t": "c", "sec": "5. Conselhos de usuários e avaliação", "q": "Pesquisa de satisfação: <span class=\"blank\">__________<\/span>, com <span class=\"blank\">_______<\/span> de reclamações publicado.", "a": "Pesquisa de satisfação: <b class=\"ans\">no mínimo anual<\/b>, com <b class=\"ans\">ranking<\/b> de reclamações publicado."}, {"d": 7, "t": "c", "sec": "5. Conselhos de usuários e avaliação", "q": "Vigência: <span class=\"blank\">__________<\/span> dias conforme a população.", "a": "Vigência: <b class=\"ans\">360 · 540 · 720<\/b> dias conforme a população."}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "O sigilo é a regra para as informações administrativas e a publicidade, a exceção.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 3º, I.", "op": "OP3: publicidade é a regra"}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "Disponibilidade é a qualidade da informação não modificada, inclusive quanto à origem, trânsito e destino.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 4º, VI e VIII.", "op": "OP2: isso é integridade"}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "A LAI aplica-se às empresas públicas e sociedades de economia mista controladas direta ou indiretamente pelos entes federados.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 1º, parágrafo único, II.", "op": ""}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "A informação sigilosa é a submetida temporariamente à restrição de acesso público por ser imprescindível à segurança da sociedade e do Estado.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 4º, III.", "op": ""}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "As entidades privadas sem fins lucrativos que recebem recursos públicos devem divulgar toda a sua contabilidade.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 2º, parágrafo único.", "op": "OP3: só a parcela dos recursos públicos e sua destinação"}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "As entidades privadas sem fins lucrativos que recebem recursos públicos se sujeitam à LAI quanto à parcela dos recursos recebidos e à sua destinação.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 2º.", "op": ""}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "A publicidade é o preceito geral e o sigilo, a exceção.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 3º, I.", "op": ""}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "A LAI não se aplica às empresas públicas e sociedades de economia mista.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 1º, parágrafo único, II.", "op": "OP3: aplica-se"}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "Primariedade é a qualidade da informação coletada na fonte, com o máximo de detalhamento, sem modificações.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 4º, IX.", "op": ""}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "Integridade é a qualidade da informação coletada na fonte, com o máximo de detalhamento.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 4º, VIII e IX.", "op": "OP2: isso é primariedade; integridade é a informação não modificada"}, {"d": 7, "t": "v", "sec": "1. Abrangência, diretrizes e conceitos", "q": "A administração direta dos Poderes Executivo, Legislativo (incluídas as Cortes de Contas) e Judiciário e o Ministério Público se submetem à LAI.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 1º, parágrafo único, I.", "op": ""}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "As informações sobre licitações e contratos só são divulgadas mediante pedido.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 8º, §1º.", "op": "OP3: transparência ativa"}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "É dever dos órgãos divulgar, independentemente de requerimentos, informações de interesse coletivo ou geral.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 8º.", "op": ""}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "A divulgação de informações de interesse coletivo só é obrigatória mediante requerimento.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 8º.", "op": "OP3: independe de requerimentos"}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "A divulgação nos sítios oficiais da internet é obrigatória, com ferramenta de pesquisa e relatórios em formatos abertos.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 8º, §§2º e 3º.", "op": ""}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "O Município de até 10.000 habitantes mantém a obrigação de divulgar em tempo real a execução orçamentária e financeira.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 8º, §4º.", "op": ""}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "Os Municípios com até 50.000 habitantes são dispensados da divulgação obrigatória na internet.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 8º, §4º.", "op": "OP1: até 10.000 habitantes"}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "Sendo a informação parcialmente sigilosa, assegura-se o acesso à parte não sigilosa, por certidão, extrato ou cópia com ocultação.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 7º, §2º.", "op": ""}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "Os editais, os resultados e todos os contratos celebrados devem constar da divulgação mínima.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 8º, §1º, IV.", "op": ""}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "Sendo a informação parcialmente sigilosa, nega-se o acesso ao documento inteiro.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 7º, §2º.", "op": "OP3: acesso à parte não sigilosa"}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "A criação do serviço de informações ao cidadão (SIC) é facultativa.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 9º.", "op": "OP3: o acesso é assegurado mediante a criação do SIC"}, {"d": 7, "t": "v", "sec": "2. Transparência ativa", "q": "Os dados gerais para acompanhamento de programas, ações, projetos e obras devem ser divulgados.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 8º, §1º, V.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O prazo de resposta pode ser prorrogado por mais 10 dias, mediante justificativa expressa.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 11, §2º.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "Não sendo possível o acesso imediato, o órgão responde em até 30 dias.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 11, §1º.", "op": "OP1: 20 dias"}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O órgão deve conceder acesso imediato à informação disponível; se não for possível, responde em até 20 dias.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 11.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O requerente deve indicar o motivo do pedido de acesso.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 10, §3º.", "op": "OP3: vedado exigir os motivos"}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "Aplica-se subsidiariamente a Lei 9.784 ao procedimento de acesso à informação.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 20.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O recurso contra a negativa de acesso é dirigido à mesma autoridade que negou.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 15, parágrafo único.", "op": "OP2: à autoridade hierarquicamente superior"}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "São vedadas exigências relativas aos motivos determinantes da solicitação de informações de interesse público.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 10, §3º.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O prazo de resposta pode ser prorrogado por mais 20 dias, sem necessidade de justificativa.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 11, §2º.", "op": "OP4: 10 dias, com justificativa expressa"}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "Se o órgão não possui a informação, arquiva o pedido sem indicar quem a detém.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 11, §1º, III.", "op": "OP4: deve indicar o órgão que a detém ou remeter o pedido"}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O serviço de busca e de fornecimento da informação é gratuito, cobrando-se apenas o custo da reprodução.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 12.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O recurso contra a negativa é de 15 dias.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 15.", "op": "OP1: 10 dias"}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "O recurso contra a negativa de acesso é de 10 dias, dirigido à autoridade hierarquicamente superior, que decide em 5 dias.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 15.", "op": ""}, {"d": 7, "t": "v", "sec": "3. Pedido de acesso e recurso", "q": "A busca da informação pode ser cobrada do requerente.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 12.", "op": "OP3: gratuita; só se cobra a reprodução"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "As informações sobre violação de direitos humanos por agentes públicos podem ser classificadas como ultrassecretas.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 21, parágrafo único.", "op": "OP3: não podem ser objeto de restrição de acesso"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "Os prazos de classificação contam da data da decisão de classificar.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 24, §1º.", "op": "OP2: contam da data de produção da informação"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "Os prazos máximos de restrição são 25 anos (ultrassecreta), 15 anos (secreta) e 5 anos (reservada).", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 24, §1º.", "op": ""}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "A informação pessoal só é restrita se classificada como reservada.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 31, §1º.", "op": "OP3: a restrição independe de classificação"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "Transcorrido o prazo de classificação, a informação torna-se automaticamente de acesso público.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 24, §4º.", "op": ""}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "A informação secreta tem prazo máximo de restrição de 25 anos.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 24, §1º.", "op": "OP2: 25 anos é a ultrassecreta; a secreta tem 15"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "A informação reservada tem prazo máximo de 10 anos.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 24, §1º.", "op": "OP1: 5 anos"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "Não pode ser negado acesso à informação necessária à tutela de direitos fundamentais.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 21.", "op": ""}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "A informação ultrassecreta pode ficar restrita por até 50 anos.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 24, §1º.", "op": "OP1: 25 anos"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "As informações pessoais ficam com acesso restrito por até 100 anos da produção, independentemente de classificação de sigilo.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 31, §1º, I.", "op": ""}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "Na classificação, usa-se o critério menos restritivo possível, considerando a gravidade do risco e o prazo máximo de restrição.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 24, §5º.", "op": ""}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "Terceiros têm acesso às informações pessoais independentemente de consentimento ou previsão legal.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 31, §1º, II.", "op": "OP3: dependem de previsão legal ou consentimento expresso"}, {"d": 7, "t": "v", "sec": "4. Sigilo e informação pessoal", "q": "O prazo de restrição da informação pessoal é de 50 anos.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 31, §1º, I.", "op": "OP1: 100 anos"}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "A entidade privada que descumprir a LAI pode sofrer suspensão de licitar e impedimento de contratar por até 2 anos.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 33, IV.", "op": ""}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "Os órgãos públicos respondem diretamente pelos danos causados pela divulgação não autorizada de informações sigilosas ou pessoais, com direito de regresso.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 34.", "op": ""}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "A inidoneidade da entidade privada é aplicada pelo chefe do setor responsável.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 33, §3º.", "op": "OP2: autoridade máxima do órgão ou entidade"}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "Os agentes públicos que descumprirem a LAI respondem apenas civilmente.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 32, §§1º e 2º.", "op": "OP3: respondem administrativamente e podem responder por improbidade"}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "Impor sigilo à informação para obter proveito pessoal ou ocultar ato ilegal é conduta ilícita do agente.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 32, V.", "op": ""}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "O órgão público só responde pelo dano da divulgação indevida se provar culpa do servidor.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 34.", "op": "OP3: responde diretamente, com regresso contra o agente"}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "Constitui conduta ilícita do agente recusar-se a fornecer a informação, retardar deliberadamente o fornecimento ou fornecê-la de forma incorreta, incompleta ou imprecisa.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 32, I.", "op": ""}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "A declaração de inidoneidade da entidade privada é de competência exclusiva da autoridade máxima do órgão, com defesa em 10 dias.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 33, §§1º e 3º.", "op": ""}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "Na aplicação das sanções do art. 33, a defesa do interessado é de 30 dias.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 33, §1º.", "op": "OP1: 10 dias"}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "As condutas do art. 32 podem configurar também improbidade administrativa.", "g": "CERTO", "src": "Lei 12.527/2011 (LAI), art. 32, §2º.", "op": ""}, {"d": 7, "t": "v", "sec": "5. Responsabilidades", "q": "A entidade privada pode sofrer suspensão de licitar por até 5 anos.", "g": "ERRADO", "src": "Lei 12.527/2011 (LAI), art. 33, IV.", "op": "OP1: até 2 anos"}, {"d": 8, "t": "c", "sec": "1. Alcance e conceitos", "q": "Controlador <span class=\"blank\">______<\/span> · operador <span class=\"blank\">_______<\/span> · encarregado <span class=\"blank\">________<\/span>.", "a": "Controlador <b class=\"ans\">decide<\/b> · operador <b class=\"ans\">executa<\/b> · encarregado <b class=\"ans\">comunica<\/b>."}, {"d": 8, "t": "c", "sec": "1. Alcance e conceitos", "q": "Biometria e dado de saúde são <span class=\"blank\">_________<\/span>; CPF e endereço são pessoais comuns.", "a": "Biometria e dado de saúde são <b class=\"ans\">sensíveis<\/b>; CPF e endereço são pessoais comuns."}, {"d": 8, "t": "c", "sec": "1. Alcance e conce
